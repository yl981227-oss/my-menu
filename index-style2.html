<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGÓN DE ORO — Menú Clásico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="text-slate-800 pb-24">
    <header class="bg-slate-900 text-white px-4 py-3.5 sticky top-0 z-40 shadow-md">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <span class="text-2xl">🏮</span>
                <div>
                    <h1 class="font-black text-sm tracking-wide">DRAGÓN DE ORO</h1>
                    <p class="text-[10px] text-slate-400">Estilo 2: Lista Compacta (Tipo App de Delivery)</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto flex h-[calc(100vh-100px)]">
        <aside class="w-28 bg-white border-r border-slate-200 p-2 space-y-1">
            <button class="w-full p-2.5 text-left text-xs font-bold rounded-xl bg-slate-900 text-white">Platos</button>
            <button class="w-full p-2.5 text-left text-xs font-bold rounded-xl text-slate-600">Entradas</button>
        </aside>
        <section class="flex-1 bg-white p-4 space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div>
                    <h4 class="font-bold text-xs text-slate-800">Colación Pollo Mongoliciano</h4>
                    <p class="text-[10px] text-slate-400">Arroz chaufán + arrollados</p>
                    <span class="font-black text-xs text-amber-600 mt-1 block">$7.300 CLP</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button class="w-7 h-7 rounded-lg bg-slate-100 font-bold">-</button>
                    <span class="text-xs font-bold">1</span>
                    <button class="w-7 h-7 rounded-lg bg-slate-900 text-white font-bold">+</button>
                </div>
            </div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div>
                    <h4 class="font-bold text-xs text-slate-800">Arrollado Primavera (5 u.)</h4>
                    <p class="text-[10px] text-slate-400">Crujientes</p>
                    <span class="font-black text-xs text-amber-600 mt-1 block">$4.200 CLP</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button class="w-7 h-7 rounded-lg bg-slate-100 font-bold">-</button>
                    <span class="text-xs font-bold">0</span>
                    <button class="w-7 h-7 rounded-lg bg-slate-900 text-white font-bold">+</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
