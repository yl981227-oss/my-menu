<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGÓN DE ORO — Menú Clásico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <!-- 顶栏 -->
    <header class="bg-slate-900 text-white px-4 py-3.5 sticky top-0 z-40 shadow-md">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <span class="text-2xl">🏮</span>
                <div>
                    <h1 class="font-black text-sm tracking-wide">DRAGÓN DE ORO</h1>
                    <p class="text-[10px] text-slate-400">Pedido Rápido & Llevar</p>
                </div>
            </div>
            <span class="bg-emerald-500/20 text-emerald-400 text-[11px] font-bold px-2.5 py-1 rounded-full border border-emerald-500/30">Abierto</span>
        </div>
    </header>

    <!-- 左右分栏点餐主体 -->
    <main class="max-w-xl mx-auto flex h-[calc(100vh-130px)]">
        <!-- 左侧分类栏 -->
        <aside class="w-28 bg-white border-r border-slate-200 overflow-y-auto no-scrollbar" id="leftCategories">
            <!-- 动态生成 -->
        </aside>

        <!-- 右侧菜品列表 -->
        <section class="flex-1 bg-white overflow-y-auto p-3 space-y-4" id="rightMenuContainer">
            <!-- 动态生成 -->
        </section>
    </main>

    <!-- 底部购物车悬浮条 -->
    <div class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900 text-white p-3 border-t border-slate-800">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 w-10 h-10 rounded-xl flex items-center justify-center font-black">
                    <i class="fa-solid fa-cart-shopping text-sm"></i>
                </div>
                <div>
                    <p id="footerTotal" class="text-base font-black">$0 CLP</p>
                    <p class="text-[10px] text-slate-400">Impuestos incluidos</p>
                </div>
            </div>
            <button onclick="openCheckoutModal()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-5 py-3 rounded-xl shadow-md">
                Ver Canasta
            </button>
        </div>
    </div>

    <!-- 结算弹窗 -->
    <div id="checkoutModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs hidden flex items-end">
        <div class="bg-white w-full max-w-xl mx-auto rounded-t-3xl max-h-[85vh] flex flex-col p-5 shadow-2xl">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h2 class="font-bold text-base">Resumen de tu Pedido</h2>
                <button onclick="closeCheckoutModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="overflow-y-auto flex-1 py-3 space-y-3" id="modalItemList"></div>
            <div class="space-y-2.5 pt-3 border-t border-slate-100">
                <div class="flex space-x-2">
                    <button onclick="setService('Para llevar')" id="bLlevar" class="flex-1 py-2 text-xs font-bold rounded-lg border-2 border-amber-500 bg-amber-50 text-amber-700">Retiro</button>
                    <button onclick="setService('Despacho')" id="bDespacho" class="flex-1 py-2 text-xs font-bold rounded-lg border-2 border-slate-200 text-slate-600">Despacho</button>
                </div>
                <input type="text" id="cName" placeholder="Tu Nombre" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                <input type="tel" id="cPhone" placeholder="Teléfono (+569...)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                <input type="text" id="cAddress" placeholder="Dirección" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs hidden">
                <button onclick="submitOrder()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg">Confirmar Pedido</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ecjxlhhhywxsqtwbujxr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjanhsaGhoeXd4c3F0d2J1anhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTE0NDgsImV4cCI6MjEwNzI2NzQ0OH0.7_OdMxyrL-rAZH8Kh3Uz8M_pgA_EfwiAzPqnfXUTiLs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let menuData = [];
        let cart = [];
        let serviceType = 'Para llevar';

        async function loadMenu() {
            const { data } = await supabaseClient.from('dishes').select('*').eq('available', true);
            menuData = data || [];
            renderLeftCategories();
            renderRightMenu();
        }

        function renderLeftCategories() {
            const cats = [...new Set(menuData.map(d => d.category))];
            document.getElementById('leftCategories').innerHTML = cats.map((c, idx) => `
                <button onclick="scrollToCat('${c}')" class="w-full p-3 text-left text-xs font-bold border-b border-slate-100 text-slate-600 hover:bg-slate-50 transition-all uppercase">${c}</button>
            `).join('');
        }

        function renderRightMenu() {
            const cats = [...new Set(menuData.map(d => d.category))];
            document.getElementById('rightMenuContainer').innerHTML = cats.map(c => `
                <div id="cat-${c}">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2 sticky top-0 bg-white py-1">${c}</h3>
                    <div class="space-y-3">
                        ${menuData.filter(d => d.category === c).map(d => `
                            <div class="flex items-center justify-between pb-3 border-b border-slate-50">
                                <div class="flex-1 pr-2">
                                    <h4 class="font-bold text-xs text-slate-800">${d.name}</h4>
                                    <p class="text-[10px] text-slate-400 line-clamp-1 mt-0.5">${d.description || ''}</p>
                                    <span class="font-black text-xs text-amber-600 mt-1 block">$${d.price.toLocaleString('es-CL')}</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button onclick='updateCart(${d.id}, -1)' class="w-6 h-6 rounded-md bg-slate-100 flex items-center justify-center font-bold text-xs">-</button>
                                    <span class="text-xs font-bold w-4 text-center" id="qty-${d.id}">${getQty(d.id)}</span>
                                    <button onclick='updateCart(${d.id}, 1)' class="w-6 h-6 rounded-md bg-slate-900 text-white flex items-center justify-center font-bold text-xs">+</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function scrollToCat(c) {
            document.getElementById('cat-' + c).scrollIntoView({ behavior: 'smooth' });
        }

        function getQty(id) {
            const item = cart.find(i => i.id === id);
            return item ? item.qty : 0;
        }

        function updateCart(id, delta) {
            const dish = menuData.find(d => d.id === id);
            if (!dish) return;
            let item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            } else if (delta > 0) {
                cart.push({ ...dish, qty: 1 });
            }
            renderRightMenu();
            updateTotal();
        }

        function updateTotal() {
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            document.getElementById('footerTotal').textContent = `$${total.toLocaleString('es-CL')} CLP`;
        }

        function openCheckoutModal() {
            document.getElementById('modalItemList').innerHTML = cart.map(i => `
                <div class="flex justify-between items-center text-xs">
                    <span>${i.name} (x${i.qty})</span>
                    <span class="font-bold">$${(i.price * i.qty).toLocaleString('es-CL')}</span>
                </div>
            `).join('');
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckoutModal() { document.getElementById('checkoutModal').classList.add('hidden'); }

        function setService(type) {
            serviceType = type;
            document.getElementById('bLlevar').className = type === 'Para llevar' ? "flex-1 py-2 text-xs font-bold rounded-lg border-2 border-amber-500 bg-amber-50 text-amber-700" : "flex-1 py-2 text-xs font-bold rounded-lg border-2 border-slate-200 text-slate-600";
            document.getElementById('bDespacho').className = type === 'Despacho' ? "flex-1 py-2 text-xs font-bold rounded-lg border-2 border-amber-500 bg-amber-50 text-amber-700" : "flex-1 py-2 text-xs font-bold rounded-lg border-2 border-slate-200 text-slate-600";
            document.getElementById('cAddress').classList.toggle('hidden', type === 'Para llevar');
        }

        async function submitOrder() {
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            const address = document.getElementById('cAddress').value;
            if (!name || !phone) { alert('Completa nombre y teléfono'); return; }
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const code = 'DRAGON-' + Math.floor(100000 + Math.random() * 900000);

            await supabaseClient.from('orders').insert([{
                order_code: code, service_type: serviceType, timing_info: 'Inmediato',
                customer_name: name, customer_phone: phone, customer_address: address,
                items: cart, subtotal: total, delivery_fee: 0, total: total,
                payment_detail: 'Efectivo', status: 'pending'
            }]);
            alert('¡Pedido exitoso! Código: ' + code);
            cart = [];
            renderRightMenu();
            updateTotal();
            closeCheckoutModal();
        }

        loadMenu();
    </script>
</body>
</html>
