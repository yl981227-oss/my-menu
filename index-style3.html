<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGÓN DE ORO — Premium Bistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
      .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="pb-28">
    <header class="bg-slate-900/80 border-b border-slate-800 sticky top-0 z-40 px-4 py-4 text-center">
        <span class="text-amber-500 text-xs tracking-widest uppercase font-bold">Estilo 3: Dark Bistro (Oscuro & Elegante)</span>
        <h1 class="font-cinzel text-xl font-bold tracking-wider text-amber-400 mt-1">DRAGÓN DE ORO</h1>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-3">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
            <div>
                <h4 class="font-bold text-sm text-slate-100">Colación Pollo Mongoliciano</h4>
                <p class="text-xs text-slate-400 mt-0.5">Especialidad de la casa</p>
                <span class="font-black text-sm text-amber-400 mt-2 block">$7.300 CLP</span>
            </div>
            <button class="bg-amber-500 text-slate-950 w-10 h-10 rounded-xl font-bold flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
            <div>
                <h4 class="font-bold text-sm text-slate-100">Arrollado Primavera (5 u.)</h4>
                <p class="text-xs text-slate-400 mt-0.5">Entrada crujiente</p>
                <span class="font-black text-sm text-amber-400 mt-2 block">$4.200 CLP</span>
            </div>
            <button class="bg-amber-500 text-slate-950 w-10 h-10 rounded-xl font-bold flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>
        </div>
    </main>
</body>
</html>
