<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <!-- 1. 登录验证遮罩层 -->
  <div id="login-screen" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl">
      <div class="text-4xl mb-3">🔒</div>
      <h2 class="text-lg font-bold mb-1">Panel de Control</h2>
      <p class="text-xs text-gray-500 mb-4">Ingresa la clave de administración</p>
      <input id="pin-input" type="password" maxlength="6" placeholder="Clave PIN" class="w-full text-center text-2xl tracking-widest border rounded-xl p-3 mb-4 focus:ring-2 focus:ring-red-600 outline-none">
      <button onclick="checkPin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow">Ingresar</button>
      <p id="pin-error" class="text-xs text-red-500 mt-2 hidden">Clave incorrecta</p>
    </div>
  </div>

  <!-- 2. 商家后台主界面 -->
  <div id="admin-panel" class="hidden max-w-2xl mx-auto pb-12">
    <!-- 顶部状态栏 -->
    <header class="bg-white border-b sticky top-0 z-20 px-4 py-3 shadow-sm flex justify-between items-center">
      <div>
        <h1 class="text-base font-black text-gray-900">Control de Menú</h1>
        <p class="text-[11px] text-gray-400">Modifica precios y disponibilidad en tiempo real</p>
      </div>
      <button onclick="logout()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg font-semibold">Salir</button>
    </header>

    <!-- 搜索与状态提示 -->
    <div class="p-4 space-y-3">
      <div class="flex gap-2">
        <input id="search-input" oninput="filterDishes()" type="text" placeholder="Buscar plato..." class="flex-1 border rounded-xl px-3 py-2 text-sm bg-white shadow-sm outline-none focus:border-red-600">
        <button onclick="fetchDishes()" class="bg-gray-800 text-white px-3 py-2 rounded-xl text-xs font-bold shrink-0">Actualizar</button>
      </div>
      <div id="status-toast" class="hidden text-center text-xs py-2 px-3 rounded-xl bg-green-100 text-green-700 font-bold shadow-sm"></div>
    </div>

    <!-- 菜品管理列表 -->
    <main id="dish-list" class="px-4 space-y-3">
      <div class="text-center py-10 text-gray-400 text-xs">Cargando platos desde la nube...</div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://ecjxlhhhwxsqtwbujxr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zsz2aqNTmTWCq5iqtOjCbQ_AHTV5jku";
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_PIN = "8888"; // 后台管理密码
    let allDishes = [];

    // 验证登录
    function checkPin() {
      const pin = document.getElementById('pin-input').value.trim();
      if (pin === ADMIN_PIN) {
        sessionStorage.setItem('isAdminAuth', 'true');
        showPanel();
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
      }
    }

    function showPanel() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('admin-panel').classList.remove('hidden');
      fetchDishes();
    }

    function logout() {
      sessionStorage.removeItem('isAdminAuth');
      window.location.reload();
    }

    // 从 Supabase 获取全部菜品
    async function fetchDishes() {
      const container = document.getElementById('dish-list');
      container.innerHTML = '<div class="text-center py-10 text-gray-400 text-xs">Cargando platos...</div>';

      const { data, error } = await db.from('dishes').select('*').order('id', { ascending: true });
      if (error) {
        container.innerHTML = `<div class="text-center py-10 text-red-500 text-xs">Error: ${error.message}</div>`;
        return;
      }
      allDishes = data;
      renderList(allDishes);
    }

    // 渲染管理卡片
    function renderList(list) {
      const container = document.getElementById('dish-list');
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-gray-400 text-xs">No se encontraron platos.</div>';
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="bg-white p-3.5 rounded-xl border ${item.is_available ? 'border-gray-200' : 'border-red-300 bg-red-50/40'} shadow-sm flex flex-col gap-2.5">
          <div class="flex justify-between items-start">
            <div class="flex-1 pr-2">
              <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">${item.category.replace('cat-', '')} #${item.id}</span>
              <h3 class="text-xs font-black text-gray-900 leading-snug">${item.name}</h3>
            </div>
            <!-- 售罄切换开关 -->
            <button onclick="toggleAvailability(${item.id}, ${item.is_available})" class="px-3 py-1.5 rounded-lg text-xs font-black shrink-0 transition ${item.is_available ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-red-600 text-white shadow-sm'}">
              ${item.is_available ? '✅ Disponible' : '⛔ AGOTADO'}
            </button>
          </div>

          <!-- 改价工具条 -->
          <div class="flex items-center gap-2 border-t pt-2 mt-0.5">
            <span class="text-xs font-bold text-gray-500">$</span>
            <input id="price-${item.id}" type="number" value="${item.price}" class="w-28 border rounded-lg px-2.5 py-1 text-xs font-bold text-gray-800 bg-gray-50 outline-none focus:border-red-600">
            <span class="text-[11px] text-gray-400">CLP</span>
            <button onclick="updatePrice(${item.id})" class="ml-auto bg-gray-900 hover:bg-black text-white text-xs font-bold px-3 py-1 rounded-lg">
              Guardar precio
            </button>
          </div>
        </div>
      `).join('');
    }

    // 搜索过滤
    function filterDishes() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = allDishes.filter(d => d.name.toLowerCase().includes(q) || d.category.toLowerCase().includes(q));
      renderList(filtered);
    }

    // 更新价格
    async function updatePrice(id) {
      const newPrice = parseInt(document.getElementById(`price-${id}`).value);
      if (isNaN(newPrice) || newPrice <= 0) {
        alert("Precio inválido");
        return;
      }
      const { error } = await db.from('dishes').update({ price: newPrice }).eq('id', id);
      if (error) {
        alert("Error al actualizar precio: " + error.message);
      } else {
        showToast("¡Precio actualizado correctamente!");
        const item = allDishes.find(d => d.id === id);
        if (item) item.price = newPrice;
      }
    }

    // 切换在售/售罄
    async function toggleAvailability(id, currentStatus) {
      const newStatus = !currentStatus;
      const { error } = await db.from('dishes').update({ is_available: newStatus }).eq('id', id);
      if (error) {
        alert("Error al cambiar estado: " + error.message);
      } else {
        showToast(newStatus ? "Plato marcado como DISPONIBLE" : "Plato marcado como AGOTADO");
        const item = allDishes.find(d => d.id === id);
        if (item) item.is_available = newStatus;
        renderList(allDishes);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('status-toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2500);
    }

    // 页面初次加载检测是否已登录
    if (sessionStorage.getItem('isAdminAuth') === 'true') {
      showPanel();
    }
  </script>
</body>
</html>
