<!DOCTYPE html>
<html lang="es" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DRAGÓN DE ORO - Panel POS 80mm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">

  <!-- 顶部导航栏 -->
  <header class="bg-slate-950 border-b border-slate-800 px-4 py-3 sticky top-0 z-30">
    <div class="max-w-3xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🐉</span>
        <div>
          <h1 class="text-sm font-black text-white tracking-wide">DRAGÓN DE ORO • POS 80MM</h1>
          <div class="flex items-center gap-1.5 text-[11px] text-emerald-400 font-bold">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span id="realtime-status">Conectando con base de datos...</span>
          </div>
        </div>
      </div>

      <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs font-bold">
        <button id="tab-orders" onclick="switchAdminTab('orders')" class="px-3 py-1.5 rounded-lg bg-red-600 text-white shadow">
          🖨️ Pedidos (<span id="pending-count">0</span>)
        </button>
        <button id="tab-dishes" onclick="switchAdminTab('dishes')" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white">
          🍱 Menú / Stock
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-3.5 space-y-4">

    <!-- 面板 1：实时接单 & 80mm 打印控制台 -->
    <div id="view-orders" class="space-y-4">

      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
        <div class="flex items-center justify-between border-b border-slate-700 pb-2.5">
          <div>
            <h2 class="text-xs font-black uppercase tracking-wider text-amber-400">🖨️ Impresora Térmica 80mm (SP-POS892UEd)</h2>
            <p id="printer-status-text" class="text-[11px] text-emerald-400 font-bold mt-0.5">✅ Modo RawBT Directo Activo</p>
          </div>
          <label class="flex items-center gap-1.5 text-xs font-bold text-emerald-400 cursor-pointer bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">
            <input type="checkbox" id="auto-print-toggle" checked class="w-4 h-4 rounded">
            <span>Auto-Imprimir</span>
          </label>
        </div>

        <!-- 核心操作按钮 -->
        <div class="flex flex-wrap gap-2 pt-1">
          <button onclick="printTestTicket()" class="flex-1 bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-black py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg transition">
            <span>🧪 Imprimir Ticket Prueba (RawBT)</span>
          </button>

          <button onclick="enableAudioAndWakeLock()" id="btn-wakelock" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-1 shadow transition">
            <span>🔔 Activar Sonido y Pantalla Activa</span>
          </button>
        </div>
      </div>

      <!-- 实时订单列表 -->
      <div class="flex items-center justify-between px-1">
        <h3 class="text-xs font-black uppercase tracking-wider text-slate-300">📋 Lista de Pedidos en Vivo</h3>
        <button onclick="fetchOrders()" class="text-xs font-bold text-blue-400 hover:text-blue-300">🔄 Actualizar ahora</button>
      </div>

      <div id="orders-list" class="space-y-3">
        <div class="text-center py-16 text-slate-500 text-xs">Cargando pedidos...</div>
      </div>
    </div>

    <!-- 面板 2：菜品上下架与价格管理 -->
    <div id="view-dishes" class="hidden space-y-4">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-3.5">
        <input id="admin-search-dish" oninput="renderAdminDishes()" type="text" placeholder="🔍 Buscar plato para cambiar precio o agotar..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-red-500">
      </div>
      <div id="admin-dishes-list" class="space-y-2"></div>
    </div>

  </main>

  <!-- 🌟 全局防拦截打印引导遮罩 -->
  <div id="rawbt-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border-2 border-red-500 rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
      <div class="text-4xl">🖨️</div>
      <h3 class="text-base font-black text-white">Nuevo Pedido Detectado</h3>
      <p class="text-xs text-slate-300">Toca el botón de abajo para enviar el ticket a la impresora:</p>
      <a id="rawbt-link-btn" href="#" target="_blank" onclick="closeRawbtModal()" class="block w-full bg-gradient-to-r from-red-600 to-rose-600 text-white font-black py-3.5 px-4 rounded-2xl shadow-lg text-sm active:scale-95 transition">
        🖨️ Imprimir Inmediatamente
      </a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ecjxlhhhywxsqtwbujxr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjanhsaGhoeXd4c3F0d2J1anhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTE0NDgsImV4cCI6MjEwNzI2NzQ0OH0.7_OdMxyrL-rAZH8Kh3Uz8M_pgA_EfwiAzPqnfXUTiLs";
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    let ordersData = [];
    let knownOrderIds = new Set();
    let isFirstLoad = true;

    function switchAdminTab(tab) {
      document.getElementById('view-orders').classList.toggle('hidden', tab !== 'orders');
      document.getElementById('view-dishes').classList.toggle('hidden', tab !== 'dishes');
      document.getElementById('tab-orders').className = tab === 'orders' ? 'px-3 py-1.5 rounded-lg bg-red-600 text-white shadow' : 'px-3 py-1.5 rounded-lg text-slate-300 hover:text-white';
      document.getElementById('tab-dishes').className = tab === 'dishes' ? 'px-3 py-1.5 rounded-lg bg-red-600 text-white shadow' : 'px-3 py-1.5 rounded-lg text-slate-300 hover:text-white';
      if (tab === 'dishes') loadAdminDishes();
    }

    async function enableAudioAndWakeLock() {
      playBeepAlert();
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
        const btn = document.getElementById('btn-wakelock');
        btn.innerText = "✅ Sonido y Pantalla Activa OK";
        btn.className = "w-full sm:w-auto bg-slate-700 text-emerald-400 font-black py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-1";
      } catch (e) {
        alert("Sonido activado.");
      }
    }

    function playBeepAlert() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.35, 0.7].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, ctx.currentTime + delay);
          osc.frequency.setValueAtTime(1174, ctx.currentTime + delay + 0.15);
          gain.gain.setValueAtTime(0.9, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.32);
        });
      } catch (e) { console.log(e); }
    }

    function cleanSpanishText(str) {
      return (str || '')
        .replace(/➔/g, '->')
        .replace(/×/g, 'x')
        .replace(/á/g, 'a').replace(/é/g, 'e').replace(/í/g, 'i').replace(/ó/g, 'o').replace(/ú/g, 'u')
        .replace(/Á/g, 'A').replace(/É/g, 'E').replace(/Í/g, 'I').replace(/Ó/g, 'O').replace(/Ú/g, 'U')
        .replace(/ñ/g, 'n').replace(/Ñ/g, 'N').replace(/ü/g, 'u').replace(/Ü/g, 'U')
        .replace(/[^\x20-\x7E\n]/g, '');
    }

    function formatLineLR(left, right, width = 48) {
      const l = cleanSpanishText(left);
      const r = cleanSpanishText(right);
      const spaces = Math.max(1, width - l.length - r.length);
      return l + ' '.repeat(spaces) + r + '\n';
    }

    // =====================================================
    // 🧾 生成 80mm 纯西语 ESC/POS 字节流
    // =====================================================
    function buildEscPosBytes(order) {
      const ESC = 0x1B;
      const FS  = 0x1C;
      const GS  = 0x1D;
      const bytes = [];

      const pushBytes = (arr) => arr.forEach(b => bytes.push(b));
      const pushText = (txt) => {
        const clean = cleanSpanishText(txt);
        for (let i = 0; i < clean.length; i++) {
          bytes.push(clean.charCodeAt(i));
        }
      };

      pushBytes([ESC, 0x40]);
      pushBytes([FS, 0x2E]);
      pushBytes([ESC, 0x52, 0x00]);
      pushBytes([ESC, 0x74, 0x00]);

      pushBytes([ESC, 0x61, 0x01]);
      pushBytes([ESC, 0x45, 0x01]);
      pushBytes([GS, 0x21, 0x11]);
      pushText("DRAGON DE ORO\n");

      pushBytes([GS, 0x21, 0x00]);
      pushBytes([ESC, 0x45, 0x00]);
      pushText("Comida China Tradicional & Sushi\n");
      pushText("Camino de la Vina 1461, Huechuraba\n");
      pushText("================================================\n");

      pushBytes([ESC, 0x61, 0x00]);
      pushBytes([ESC, 0x45, 0x01]);
      pushText(`PEDIDO: ${order.order_code}\n`);
      pushBytes([ESC, 0x45, 0x00]);
      const dt = new Date(order.created_at || Date.now()).toLocaleString('es-CL');
      pushText(`FECHA:  ${dt}\n`);
      pushText("------------------------------------------------\n");

      pushBytes([ESC, 0x45, 0x01]);
      pushBytes([GS, 0x21, 0x01]);
      pushText(`SERVICIO: ${(order.service_type || '').toUpperCase()}\n`);
      pushText(`HORARIO:  ${cleanSpanishText(order.timing_info || 'Lo antes posible')}\n`);
      pushBytes([GS, 0x21, 0x00]);
      pushBytes([ESC, 0x45, 0x00]);
      pushText("------------------------------------------------\n");

      pushBytes([ESC, 0x45, 0x01]);
      pushText(`CLIENTE:  ${order.customer_name}\n`);
      pushText(`TELEFONO: ${order.customer_phone}\n`);
      if (order.customer_address) {
        pushText(`DIRECCION: ${order.customer_address}\n`);
      }
      pushBytes([ESC, 0x45, 0x00]);
      pushText("================================================\n");
      pushBytes([ESC, 0x45, 0x01]);
      pushText(formatLineLR("CANT  DESCRIPCION", "TOTAL", 48));
      pushBytes([ESC, 0x45, 0x00]);
      pushText("------------------------------------------------\n");

      const items = Array.isArray(order.items) ? order.items : [];
      items.forEach(item => {
        const lineTotal = "$" + Number(item.unitPrice * item.qty).toLocaleString('es-CL');
        const titleLeft = `${item.qty}x ${item.name}`;

        pushBytes([ESC, 0x45, 0x01]);
        pushBytes([GS, 0x21, 0x01]);
        pushText(formatLineLR(titleLeft, lineTotal, 48));
        pushBytes([ESC, 0x45, 0x00]);

        if (item.options && item.options.length > 0) {
          item.options.forEach(opt => {
            pushText(`   * ${cleanSpanishText(opt)}\n`);
          });
        }
        pushBytes([GS, 0x21, 0x00]);
        pushText("------------------------------------------------\n");
      });

      pushText(formatLineLR("Subtotal:", "$" + Number(order.subtotal).toLocaleString('es-CL'), 48));
      pushText(formatLineLR("Costo de Entrega:", "$" + Number(order.delivery_fee).toLocaleString('es-CL'), 48));

      pushBytes([ESC, 0x45, 0x01]);
      pushBytes([GS, 0x21, 0x01]);
      pushText(formatLineLR("TOTAL A PAGAR:", "$" + Number(order.total).toLocaleString('es-CL') + " CLP", 48));
      pushBytes([GS, 0x21, 0x00]);
      pushBytes([ESC, 0x45, 0x00]);

      pushText("------------------------------------------------\n");
      pushBytes([ESC, 0x45, 0x01]);
      pushText(`PAGO: ${order.payment_detail}\n`);
      if (order.notes && order.notes !== 'Sin comentarios') {
        pushText(`NOTAS: ${order.notes}\n`);
      }
      pushBytes([ESC, 0x45, 0x00]);
      pushText("================================================\n");

      pushBytes([ESC, 0x61, 0x01]);
      pushText("Gracias por su preferencia!\n\n\n\n\n\n");
      pushBytes([GS, 0x56, 0x42, 0x00]);

      return new Uint8Array(bytes);
    }

    // 🌟 核心优化：利用“弹窗防拦截机制”，通过用户点击按钮彻底绕过 Chrome 限制
    function printOrderTicket(order) {
      const escposBytes = buildEscPosBytes(order);
      let binary = '';
      for (let i = 0; i < escposBytes.byteLength; i++) {
        binary += String.fromCharCode(escposBytes[i]);
      }
      const base64Data = window.btoa(binary);
      const rawbtUrl = 'rawbt:base64,' + base64Data;

      if (document.getElementById('auto-print-toggle').checked) {
        // 弹出醒目防拦截弹窗，用户只需点一下即可 100% 唤醒打印机
        document.getElementById('rawbt-link-btn').href = rawbtUrl;
        document.getElementById('rawbt-modal').classList.remove('hidden');
      } else {
        window.location.href = rawbtUrl;
      }

      if (order.id) markOrderPrinted(order.id);
    }

    function closeRawbtModal() {
      document.getElementById('rawbt-modal').classList.add('hidden');
    }

    function printTestTicket() {
      const sampleOrder = {
        id: 0,
        order_code: "TEST-80MM",
        created_at: new Date().toISOString(),
        service_type: "Delivery (Envio a domicilio)",
        timing_info: "Lo antes posible (Inmediato)",
        customer_name: "Cliente de Prueba",
        customer_phone: "56912345678",
        customer_address: "Camino de la Vina 1461, Huechuraba",
        items: [
          { qty: 1, name: "Menu 2 personas B", unitPrice: 26800, options: ["Arroz: Cambiar x1 por Arroz Blanco", "Cambio: Wantan frito -> Carne Mongoliana", "Con aji"] },
          { qty: 1, name: "California Ebi", unitPrice: 6500, options: ["Envuelto en: Sesamo", "Salsa incluida: Salsa Soya", "Con Wasabi (+$500)"] }
        ],
        subtotal: 33300,
        delivery_fee: 1800,
        total: 35100,
        payment_detail: "Efectivo $35.100 (monto recibido $40.000, vuelto $4.900)",
        notes: "Ticket de prueba 80mm COMPLETO OK"
      };
      printOrderTicket(sampleOrder);
    }

    async function markOrderPrinted(orderId) {
      if (!orderId) return;
      await db.from('orders').update({ status: 'printed' }).eq('id', orderId);
      fetchOrders();
    }

    async function fetchOrders() {
      const statusEl = document.getElementById('realtime-status');
      const { data, error } = await db.from('orders').select('*').order('id', { ascending: false }).limit(40);

      if (error) {
        statusEl.className = "text-rose-400 font-bold";
        statusEl.innerText = "⚠️ Error: " + error.message;
        return;
      }

      statusEl.className = "text-emerald-400 font-bold";
      statusEl.innerText = "Escuchando pedidos en vivo (Conectado OK)";

      ordersData = data || [];
      let newOrderArrived = null;

      ordersData.forEach(o => {
        if (!knownOrderIds.has(o.id)) {
          knownOrderIds.add(o.id);
          if (!isFirstLoad && o.status === 'pending') {
            newOrderArrived = o;
          }
        }
      });

      isFirstLoad = false;
      renderOrdersList();

      if (newOrderArrived) {
        playBeepAlert();
        printOrderTicket(newOrderArrived);
      }
    }

    function renderOrdersList() {
      const container = document.getElementById('orders-list');
      const pendingCount = ordersData.filter(o => o.status === 'pending').length;
      document.getElementById('pending-count').innerText = pendingCount;

      if (ordersData.length === 0) {
        container.innerHTML = '<div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-10 text-center text-slate-400 text-xs">✅ Sistema listo. Esperando el primer pedido...</div>';
        return;
      }

      let html = '';
      ordersData.forEach(o => {
        const isPending = o.status === 'pending';
        const statusBadge = isPending
          ? '<span class="bg-red-600 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full animate-pulse">🔔 NUEVO</span>'
          : '<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full">🖨️ IMPRESO</span>';

        const dt = new Date(o.created_at).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
        const items = Array.isArray(o.items) ? o.items : [];
        let itemsHtml = '';
        items.forEach(it => {
          const opts = (it.options && it.options.length > 0)
            ? `<div class="text-[11px] text-amber-300 font-semibold mt-0.5">• ${it.options.join(' | ')}</div>`
            : '';
          itemsHtml += `
            <div class="py-1.5 border-b border-slate-700/60 last:border-0 flex justify-between items-start">
              <div>
                <span class="font-black text-white text-xs">${it.qty}x ${it.name}</span>
                ${opts}
              </div>
              <span class="text-xs font-bold text-slate-300">$${Number(it.unitPrice * it.qty).toLocaleString('es-CL')}</span>
            </div>
          `;
        });

        html += `
          <div class="bg-slate-800 border ${isPending ? 'border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.25)]' : 'border-slate-700'} rounded-2xl p-4 space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-700 pb-2">
              <div class="flex items-center gap-2">
                ${statusBadge}
                <span class="font-black text-sm text-white">${o.order_code}</span>
                <span class="text-xs text-slate-400">⏰ ${dt}</span>
              </div>
              <span class="text-base font-black text-emerald-400">$${Number(o.total).toLocaleString('es-CL')} CLP</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs bg-slate-900/70 p-2.5 rounded-xl border border-slate-700/80">
              <div><span class="text-slate-400">Servicio:</span> <span class="font-black text-amber-300">${o.service_type}</span></div>
              <div><span class="text-slate-400">Horario:</span> <span class="font-black text-white">${o.timing_info}</span></div>
              <div><span class="text-slate-400">Cliente:</span> <span class="font-bold text-white">${o.customer_name} (${o.customer_phone})</span></div>
              ${o.customer_address ? `<div><span class="text-slate-400">Dirección:</span> <span class="font-bold text-rose-300">${o.customer_address}</span></div>` : ''}
            </div>

            <div class="bg-slate-900/40 rounded-xl p-2.5 border border-slate-700/50">
              ${itemsHtml}
            </div>

            <div class="text-[11px] text-slate-300 flex flex-wrap justify-between gap-2 pt-1">
              <div><b>Pago:</b> ${o.payment_detail}</div>
              ${o.notes ? `<div class="text-amber-300"><b>Nota:</b> ${o.notes}</div>` : ''}
            </div>

            <div class="flex gap-2 pt-1">
              <button onclick='printOrderTicket(${JSON.stringify(o).replace(/'/g, "&#39;")})' class="flex-1 bg-red-600 hover:bg-red-500 active:scale-95 text-white font-black py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow transition">
                <span>🖨️ Imprimir Ticket 80mm</span>
              </button>
              <a href="https://wa.me/${(o.customer_phone || '').replace(/\D/g, '')}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-1">
                <span>💬 WhatsApp Cliente</span>
              </a>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    let adminDishes = [];
    async function loadAdminDishes() {
      const { data } = await db.from('dishes').select('*').order('id', { ascending: true });
      adminDishes = data || [];
      renderAdminDishes();
    }

    function renderAdminDishes() {
      const q = (document.getElementById('admin-search-dish').value || '').toLowerCase().trim();
      const list = document.getElementById('admin-dishes-list');
      const filtered = adminDishes.filter(d => (d.name || '').toLowerCase().includes(q));

      let html = '';
      filtered.forEach(d => {
        html += `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex items-center justify-between gap-2 text-xs">
            <div class="flex-1">
              <div class="font-bold text-white">${d.name}</div>
              <div class="text-emerald-400 font-black mt-0.5">$${Number(d.price).toLocaleString('es-CL')} CLP</div>
            </div>
            <button onclick="toggleDishStock(${d.id}, ${!d.is_available})" class="px-3 py-2 rounded-xl font-black ${d.is_available ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">
              ${d.is_available ? '✅ Disponible' : '🚫 Agotado'}
            </button>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    async function toggleDishStock(id, newState) {
      await db.from('dish').update({ is_available: newState }).eq('id', id);
      loadAdminDishes();
    }

    db.channel('orders-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => {
        fetchOrders();
      })
      .subscribe();

    fetchOrders();
    setInterval(fetchOrders, 4000);
  </script>
</body>
</html>
