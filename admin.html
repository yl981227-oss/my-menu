    async function enableAudioAndWakeLock() {
      playBeepAlert();
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
        const btn = document.getElementById('btn-wakelock');
        btn.innerText = "✅ Sonido y Pantalla Activa OK";

      }

    function playBeepAlert() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.35, 0.7].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, ctx.currentTime + delay);
          osc.frequency.setValueAtTime(1174, ctx.currentTime + delay + 0.15);
          gain.gain.setValueAtTime(0.9, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.32);
        });
      } catch (e) { console.log(e); }
    }

    function cleanSpanishText(str) {
      return (str || '')
        .replace(/➔/g, '->')
        .replace(/×/g, 'x')
        .replace(/á/g, 'a').replace(/é/g, 'e').replace(/í/g, 'i').replace(/ó/g, 'o').replace(/ú/g, 'u')
        .replace(/Á/g, 'A').replace(/É/g, 'E').replace(/Í/g, 'I').replace(/Ó/g, 'O').replace(/Ú/g, 'U')
        .replace(/ñ/g, 'n').replace(/Ñ/g, 'N').replace(/ü/g, 'u').replace(/Ü/g, 'U')
        .replace(/[^\x20-\x7E\n]/g, '');
    }

    function formatLineLR(left, right, width = 48) {
      const l = cleanSpanishText(left);
      const r = cleanSpanishText(right);
      const spaces = Math.max(1, width - l.length - r.length);
      return l + ' '.repeat(spaces) + r + '\n';
    }

    // =====================================================
    // 🧾 生成 80mm 纯西语 ESC/POS 打印字节流
    // =====================================================
    function buildEscPosBytes(order) {
      const ESC = 0x1B;
      const FS  = 0x1C;
      const GS  = 0x1D;
      const bytes = [];

      const pushBytes = (arr) => arr.forEach(b => bytes.push(b));
      const pushText = (txt) => {
        const clean = cleanSpanishText(txt);
        for (let i = 0; i < clean.length; i++) {
          bytes.push(clean.charCodeAt(i));
        }
      };

      // 初始化并强制切换国际字符集 USA，确保 $ 符号正常打印
      pushBytes([ESC, 0x40]);
      pushBytes([FS, 0x2E]);
      pushBytes([ESC, 0x52, 0x00]);
      pushBytes([ESC, 0x74, 0x00]);

      // 店铺抬头
      pushBytes([ESC, 0x61, 0x01]);
      pushBytes([ESC, 0x45, 0x01]);
      pushBytes([GS, 0x21, 0x11]);
      pushText("CHINA IDEAL\n");

      pushBytes([GS, 0x21, 0x00]);
      pushBytes([ESC, 0x45, 0x00]);
      pushText("Comida China Cantonesa & Sushi\n");
      pushText("Camino de la Vina 1461, Huechuraba\n");
      pushText("================================================\n");

      // 订单编号与日期
      pushBytes([ESC, 0x61, 0x00]);
      pushBytes([ESC, 0x45, 0x01]);
      pushText(`PEDIDO: ${order.order_code}\n`);
      pushBytes([ESC, 0x45, 0x00]);
      const dt = new Date(order.created_at || Date.now()).toLocaleString('es-CL');
      pushText(`FECHA:  ${dt}\n`);
      pushText("------------------------------------------------\n");

      // 配送类型与时间（倍高醒目显示）
      pushBytes([ESC, 0x45, 0x01]);
      pushBytes([GS, 0x21, 0x01]);
      pushText(`SERVICIO: ${(order.service_type || '').toUpperCase()}\n`);
      pushText(`HORARIO:  ${cleanSpanishText(order.timing_info || 'Lo antes posible')}\n`);
      pushBytes([GS, 0x21, 0x00]);
      pushBytes([ESC, 0x45, 0x00]);
      pushText("------------------------------------------------\n");

      // 客户信息
      pushBytes([ESC, 0x45, 0x01]);
      pushText(`CLIENTE:  ${order.customer_name}\n`);
      pushText(`TELEFONO: ${order.customer_phone}\n`);
      if (order.customer_address) {
        pushText(`DIRECCION: ${order.customer_address}\n`);
      }
      pushBytes([ESC, 0x45, 0x00]);
      pushText("================================================\n");
      pushBytes([ESC, 0x45, 0x01]);
      pushText(formatLineLR("CANT  DESCRIPCION", "TOTAL", 48));
      pushBytes([ESC, 0x45, 0x00]);
      pushText("------------------------------------------------\n");

      // 菜品列表（倍高大字方便后厨看单）
      const items = Array.isArray(order.items) ? order.items : [];
      items.forEach(item => {
        const lineTotal = "$" + Number(item.unitPrice * item.qty).toLocaleString('es-CL');
        const titleLeft = `${item.qty}x ${item.name}`;

        pushBytes([ESC, 0x45, 0x01]);
        pushBytes([GS, 0x21, 0x01]);
        pushText(formatLineLR(titleLeft, lineTotal, 48));
        pushBytes([ESC, 0x45, 0x00]);

        if (item.options && item.options.length > 0) {
          item.options.forEach(opt => {
            pushText(`   * ${cleanSpanishText(opt)}\n`);
          });
        }
        pushBytes([GS, 0x21, 0x00]);
        pushText("------------------------------------------------\n");
      });

      // 费用总计
      pushText(formatLineLR("Subtotal:", "$" + Number(order.subtotal).toLocaleString('es-CL'), 48));
      pushText(formatLineLR("Costo de Entrega:", "$" + Number(order.delivery_fee).toLocaleString('es-CL'), 48));

      pushBytes([ESC, 0x45, 0x01]);
      pushBytes([GS, 0x21, 0x01]);
      pushText(formatLineLR("TOTAL A PAGAR:", "$" + Number(order.total).toLocaleString('es-CL') + " CLP", 48));
      pushBytes([GS, 0x21, 0x00]);
      pushBytes([ESC, 0x45, 0x00]);

      pushText("------------------------------------------------\n");
      pushBytes([ESC, 0x45, 0x01]);
      pushText(`PAGO: ${order.payment_detail}\n`);
      if (order.notes && order.notes !== 'Sin comentarios') {
        pushText(`NOTAS: ${order.notes}\n`);
      }
      pushBytes([ESC, 0x45, 0x00]);
      pushText("================================================\n");

      // 底部走纸 6 行 + 自动切刀
      pushBytes([ESC, 0x61, 0x01]);
      pushText("Gracias por su preferencia!\n\n\n\n\n\n");
      pushBytes([GS, 0x56, 0x42, 0x00]);

      return new Uint8Array(bytes);
    }

    function buildRawbtUrl(order) {
      const escposBytes = buildEscPosBytes(order);
      let binary = '';
      for (let i = 0; i < escposBytes.byteLength; i++) {
        binary += String.fromCharCode(escposBytes[i]);
      }
      // 用 intent: 显式指定 RawBT 包名，直接拉起应用，绕开 Chrome 的协议确认框
      return 'intent:base64,' + window.btoa(binary) + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end';
    }

    // =====================================================
    // Impresion: dentro de la APP usa TCP nativo, en navegador usa RawBT
    // =====================================================
    function getPrinterIp() {
      const input = document.getElementById('printer-ip');
      const typed = input ? input.value.trim() : '';
      return typed || localStorage.getItem('printer_ip') || '10.0.4.250';
    }

    function savePrinterIp() {
      const input = document.getElementById('printer-ip');
      const v = input ? input.value.trim() : '';
      if (!v) { alert('Ingrese una IP valida'); return; }
      localStorage.setItem('printer_ip', v);
      if (isNativeApp() && window.AndroidPrinter.saveConfig) {
        try { window.AndroidPrinter.saveConfig(v, 9100); } catch (e) {}
      }
      alert('IP guardada: ' + v);
    }

    function bytesToBase64(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return window.btoa(binary);
    }

    function isNativeApp() {
      return !!(window.AndroidPrinter && typeof window.AndroidPrinter.print === 'function');
    }

    // 手动点击打印按钮：APP 内走原生 TCP，浏览器内唤起 RawBT
    function printOrderTicket(order) {
      if (isNativeApp()) {
        try {
          const bytes = buildEscPosBytes(order);
          window.AndroidPrinter.print(getPrinterIp(), 9100, bytesToBase64(bytes));
          if (order.id) markOrderPrinted(order.id);
          return;
        } catch (e) {
          console.log('native print failed, fallback to RawBT', e);
        }
      }
      window.location.href = buildRawbtUrl(order);
      if (order.id) markOrderPrinted(order.id);
    }

    // Inicializar IP y etiqueta de modo al cargar
    (function initPrinterUi() {
      const ip = localStorage.getItem('printer_ip') || '10.0.4.250';
      const input = document.getElementById('printer-ip');
      if (input) input.value = ip;
      if (isNativeApp() && window.AndroidPrinter.saveConfig) {
        try { window.AndroidPrinter.saveConfig(ip, 9100); } catch (e) {}
      }
      const label = document.getElementById('printer-mode-label');
      if (label) {
        label.innerText = isNativeApp()
          ? '✅ Modo APP Nativo · Impresión en 2do plano activa'
          : '✅ Modo Red LAN (WiFi / Ethernet vía RawBT)';
      }
    })();

    // 来新单触发：APP 内直接原生打印（全自动），浏览器内弹窗兜底
    let pendingOrder = null;
    let printChain = Promise.resolve();

    function triggerAutoPrint(order) {
      pendingOrder = order;

      // APP 内：由原生前台服务统一打印（后台也能工作），网页只负责提示，避免重复出票
      if (isNativeApp()) {
        playBeepAlert();
        return;
      }

      // 浏览器环境：弹出确认框，由用户点击后拉起 RawBT
      const rawbtUrl = buildRawbtUrl(order);
      document.getElementById('modal-order-code').innerText = `${order.order_code} • $${Number(order.total).toLocaleString('es-CL')} CLP`;
      document.getElementById('rawbt-link-btn').href = rawbtUrl;
      document.getElementById('rawbt-modal').classList.remove('hidden');

      if (order.id) markOrderPrinted(order.id);
    }

    // 弹窗按钮：统一走 printOrderTicket，APP 内自动选择原生通道
    function printFromModal() {
      closeRawbtModal();
      if (pendingOrder) printOrderTicket(pendingOrder);
    }

    function closeRawbtModal() {
      document.getElementById('rawbt-modal').classList.add('hidden');
    }

    function printTestTicket() {

        id: 0,
        order_code: "TEST-LAN-80MM",
        created_at: new Date().toISOString(),
        service_type: "Delivery (Envio a domicilio)",

          { qty: 1, name: "California Ebi", unitPrice: 6500, options: ["Envuelto en: Sesamo", "Salsa incluida: Salsa Soya", "Con Wasabi (+$500)"] }
        ],

    async function markOrderPrinted(orderId) {
      if (!orderId) return;
      // 只有新单（pending）才推进到 preparing，重复打印不会把已完成的单降级
      await db.from('orders').update({ status: 'preparing' }).eq('id', orderId).eq('status', 'pending');
      fetchOrders();
    }

    async function setOrderStatus(orderId, status) {
      const { error } = await db.from('orders').update({ status: status }).eq('id', orderId);
      if (error) { alert('Error: ' + error.message); return; }
      fetchOrders();
    }

    async function fetchOrders() {
      const statusEl = document.getElementById('realtime-status');
      const { data, error } = await db.from('orders').select('*').order('id', { ascending: false }).limit(40);

      if (error) {
        statusEl.className = "text-rose-400 font-bold";
        statusEl.innerText = "⚠️ Error: " + error.message;
        return;
      }

      statusEl.className = "text-emerald-400 font-bold";
      statusEl.innerText = "Escuchando pedidos en vivo (Conectado OK)";

      ordersData = data || [];
      let newOrders = [];

      ordersData.forEach(o => {
        if (!knownOrderIds.has(o.id)) {
          knownOrderIds.add(o.id);
          if (!isFirstLoad && o.status === 'pending') {
            newOrders.push(o);
          }
        }
      });

      isFirstLoad = false;
      renderOrdersList();

      if (newOrders.length > 0) {
        playBeepAlert();
        if (document.getElementById('auto-print-toggle').checked) {
          newOrders.reverse().forEach(o => triggerAutoPrint(o));
        }
      }
    }

    function renderOrdersList() {
      const container = document.getElementById('orders-list');
      const pendingCount = ordersData.filter(o => o.status === 'pending').length;
      document.getElementById('pending-count').innerText = pendingCount;

      if (ordersData.length === 0) {
        container.innerHTML = '<div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-10 text-center text-slate-400 text-xs">✅ Sistema listo. Esperando pedidos...</div>';
        return;
      }

      let html = '';
      ordersData.forEach(o => {
        const isPending = o.status === 'pending';
        const STATUS_STYLE = {
          pending:   { text: '🔔 NUEVO',       cls: 'bg-red-600 text-white animate-pulse' },
          preparing: { text: '👨‍🍳 PREPARANDO', cls: 'bg-blue-500/20 text-blue-300 border border-blue-500/40' },
          printed:   { text: '👨‍🍳 PREPARANDO', cls: 'bg-blue-500/20 text-blue-300 border border-blue-500/40' },
          ready:     { text: '✅ LISTO',        cls: 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' },
          delivered: { text: '📦 ENTREGADO',    cls: 'bg-slate-600/30 text-slate-400 border border-slate-600' }
        };
        const st = STATUS_STYLE[o.status] || STATUS_STYLE.pending;
        const statusBadge = `<span class="${st.cls} text-[10px] font-black px-2.5 py-0.5 rounded-full">${st.text}</span>`;

        const dt = new Date(o.created_at).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
        const items = Array.isArray(o.items) ? o.items : [];
        let itemsHtml = '';
        items.forEach(it => {
          const opts = (it.options && it.options.length > 0)
            ? `<div class="text-[11px] text-amber-300 font-semibold mt-0.5">• ${it.options.join(' | ')}</div>`
            : '';
          itemsHtml += `
            <div class="py-1.5 border-b border-slate-700/60 last:border-0 flex justify-between items-start">
              <div>
                <span class="font-black text-white text-xs">${it.qty}x ${it.name}</span>
                ${opts}
              </div>
              <span class="text-xs font-bold text-slate-300">$${Number(it.unitPrice * it.qty).toLocaleString('es-CL')}</span>
            </div>
          `;
        });

        html += `
          <div class="bg-slate-800 border ${isPending ? 'border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.25)]' : 'border-slate-700'} rounded-2xl p-4 space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-700 pb-2">
              <div class="flex items-center gap-2">
                ${statusBadge}
                <span class="font-black text-sm text-white">${o.order_code}</span>
                <span class="text-xs text-slate-400">⏰ ${dt}</span>
              </div>
              <span class="text-base font-black text-emerald-400">$${Number(o.total).toLocaleString('es-CL')} CLP</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs bg-slate-900/70 p-2.5 rounded-xl border border-slate-700/80">
              <div><span class="text-slate-400">Servicio:</span> <span class="font-black text-amber-300">${o.service_type}</span></div>
              <div><span class="text-slate-400">Horario:</span> <span class="font-black text-white">${o.timing_info}</span></div>
              <div><span class="text-slate-400">Cliente:</span> <span class="font-bold text-white">${o.customer_name} (${o.customer_phone})</span></div>
              ${o.customer_address ? `<div><span class="text-slate-400">Dirección:</span> <span class="font-bold text-rose-300">${o.customer_address}</span></div>` : ''}
            </div>

            <div class="bg-slate-900/40 rounded-xl p-2.5 border border-slate-700/50">
              ${itemsHtml}
            </div>

            <div class="text-[11px] text-slate-300 flex flex-wrap justify-between gap-2 pt-1">
              <div><b>Pago:</b> ${o.payment_detail}</div>
              ${o.notes ? `<div class="text-amber-300"><b>Nota:</b> ${o.notes}</div>` : ''}
            </div>

            <div class="flex gap-1.5 pt-1">
              ${(o.status === 'pending' || o.status === 'printed' || !o.status)
                ? `<button onclick="setOrderStatus(${o.id},'preparing')" class="flex-1 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-black py-2 rounded-xl text-[11px]">👨‍🍳 Preparando</button>`
                : ''}
              ${(o.status === 'preparing' || o.status === 'printed')
                ? `<button onclick="setOrderStatus(${o.id},'ready')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black py-2 rounded-xl text-[11px]">✅ Listo</button>`
                : ''}
              ${o.status === 'ready'
                ? `<button onclick="setOrderStatus(${o.id},'delivered')" class="flex-1 bg-slate-600 hover:bg-slate-500 active:scale-95 text-white font-black py-2 rounded-xl text-[11px]">📦 Entregado</button>`
                : ''}
              ${o.status === 'delivered'
                ? `<div class="flex-1 text-center text-[11px] text-slate-500 font-bold py-2">Pedido completado</div>`
                : ''}
            </div>

            <div class="flex gap-2 pt-1">
              <button onclick='printOrderTicket(${JSON.stringify(o).replace(/'/g, "&#39;")})' class="flex-1 bg-red-600 hover:bg-red-500 active:scale-95 text-white font-black py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow transition">
                <span>🖨️ Imprimir Ticket 80mm</span>
              </button>
              <a href="https://wa.me/${(o.customer_phone || '').replace(/\D/g, '')}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-1">
                <span>💬 WhatsApp Cliente</span>
              </a>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    let adminDishes = [];
    async function loadAdminDishes() {
      const { data } = await db.from('dishes').select('*').order('id', { ascending: true });
      adminDishes = data || [];
      renderAdminDishes();
    }

    function renderAdminDishes() {
      const q = (document.getElementById('admin-search-dish').value || '').toLowerCase().trim();
      const list = document.getElementById('admin-dishes-list');
      const filtered = adminDishes.filter(d => (d.name || '').toLowerCase().includes(q));

      let html = '';
      filtered.forEach(d => {
        html += `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex items-center justify-between gap-2 text-xs">
            <div class="flex-1">
              <div class="font-bold text-white">${d.name}</div>
              <div class="text-emerald-400 font-black mt-0.5">$${Number(d.price).toLocaleString('es-CL')} CLP</div>
            </div>
            <button onclick="toggleDishStock(${d.id}, ${!d.is_available})" class="px-3 py-2 rounded-xl font-black ${d.is_available ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">
              ${d.is_available ? '✅ Disponible' : '🚫 Agotado'}
            </button>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    async function toggleDishStock(id, newState) {
      await db.from('dishes').update({ is_available: newState }).eq('id', id);
      loadAdminDishes();
    }

    db.channel('orders-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => {
        fetchOrders();
      })
      .subscribe();

    fetchOrders();
    setInterval(fetchOrders, 4000);
  </script>
</body>
</html>
