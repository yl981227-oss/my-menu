  <div id="login-screen" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl">
      <div class="text-4xl mb-3">🔒</div>
      <h2 class="text-lg font-bold mb-1">Panel de Control</h2>
      <p class="text-xs text-gray-500 mb-4">Ingresa la clave de administración</p>
      <input id="pin-input" type="password" maxlength="6" placeholder="Clave PIN" class="w-full text-center text-2xl tracking-widest border rounded-xl p-3 mb-4 focus:ring-2 focus:ring-red-600 outline-none">
      <button onclick="checkPin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow">Ingresar</button>
      <p id="pin-error" class="text-xs text-red-500 mt-2 hidden">Clave incorrecta</p>
    </div>
  </div>

  <!-- 2. 商家后台主界面 -->
  <div id="admin-panel" class="hidden max-w-2xl mx-auto pb-12">
    <!-- 顶部状态栏 -->
    <header class="bg-white border-b sticky top-0 z-20 px-4 py-3 shadow-sm flex justify-between items-center">

        <h1 class="text-base font-black text-gray-900">Control de Menú</h1>

      </div>
      <button onclick="logout()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg font-semibold">Salir</button>
    </header>

    <!-- 搜索与状态提示 -->
    <div class="p-4 space-y-3">
      <div class="flex gap-2">
        <input id="search-input" oninput="filterDishes()" type="text" placeholder="Buscar plato..." class="flex-1 border rounded-xl px-3 py-2 text-sm bg-white shadow-sm outline-none focus:border-red-600">
        <button onclick="fetchDishes()" class="bg-gray-800 text-white px-3 py-2 rounded-xl text-xs font-bold shrink-0">Actualizar</button>
      </div>
      <div id="status-toast" class="hidden text-center text-xs py-2 px-3 rounded-xl bg-green-100 text-green-700 font-bold shadow-sm"></div>
    </div>

    <!-- 菜品管理列表 -->
