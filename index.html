<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码点单 - 菜单</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-28">

  <!-- 顶部店铺招牌 -->
  <header class="bg-red-600 text-white p-4 shadow-md sticky top-0 z-10">
    <h1 class="text-xl font-bold">🍜 COMIDA CHINA</h1>
    <p class="text-xs text-red-100 mt-1">选好后直接通过 WhatsApp 发送订单</p>
  </header>

  <!-- 取餐方式选择 -->
  <section class="p-4 bg-white mb-3 shadow-sm">
    <label class="block text-sm font-semibold mb-2">选择服务方式：</label>
    <div class="grid grid-cols-2 gap-3">
      <button id="btn-delivery" onclick="setOrderType('delivery')" class="py-2 rounded-lg border-2 border-red-600 bg-red-50 text-red-600 font-bold text-sm">
        🛵 送货上门 (Delivery)
      </button>
      <button id="btn-pickup" onclick="setOrderType('pickup')" class="py-2 rounded-lg border border-gray-300 text-gray-600 font-bold text-sm">
        🛍️ 到店自取 (Retiro)
      </button>
    </div>
  </section>

  <!-- 菜品列表 -->
  <main class="px-4">
    <h2 class="text-md font-bold mb-3 text-gray-700">热销精选</h2>
    <div class="space-y-3">
      
      <!-- 菜品 1 -->
      <div class="bg-white p-3 rounded-xl shadow-sm flex gap-3 items-center">
        <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=200&h=200&fit=crop" class="w-20 h-20 rounded-lg object-cover">
        <div class="flex-1">
          <h3 class="font-bold text-sm text-gray-900">蒙古牛肉 (Carne Mongoliana)</h3>
          <p class="text-xs text-gray-500 mt-0.5">精选牛肉片爆炒大葱，浓郁酱香</p>
          <div class="text-sm font-bold text-red-600 mt-1">$7.500 CLP</div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="changeQty(1, -1)" class="w-8 h-8 rounded-full bg-gray-200 text-gray-700 font-bold flex items-center justify-center text-lg active:scale-95">-</button>
          <span id="qty-1" class="text-base font-bold w-4 text-center">0</span>
          <button onclick="changeQty(1, 1)" class="w-8 h-8 rounded-full bg-red-600 text-white font-bold flex items-center justify-center text-lg active:scale-95">+</button>
        </div>
      </div>

      <!-- 菜品 2 -->
      <div class="bg-white p-3 rounded-xl shadow-sm flex gap-3 items-center">
        <img src="https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=200&h=200&fit=crop" class="w-20 h-20 rounded-lg object-cover">
        <div class="flex-1">
          <h3 class="font-bold text-sm text-gray-900">炒饭 (Arroz Chaufán)</h3>
          <p class="text-xs text-gray-500 mt-0.5">经典炒饭配鸡蛋、肉丁与葱花</p>
          <div class="text-sm font-bold text-red-600 mt-1">$4.500 CLP</div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="changeQty(2, -1)" class="w-8 h-8 rounded-full bg-gray-200 text-gray-700 font-bold flex items-center justify-center text-lg active:scale-95">-</button>
          <span id="qty-2" class="text-base font-bold w-4 text-center">0</span>
          <button onclick="changeQty(2, 1)" class="w-8 h-8 rounded-full bg-red-600 text-white font-bold flex items-center justify-center text-lg active:scale-95">+</button>
        </div>
      </div>

      <!-- 菜品 3 -->
      <div class="bg-white p-3 rounded-xl shadow-sm flex gap-3 items-center">
        <img src="https://images.unsplash.com/photo-1562967914-608f82629710?w=200&h=200&fit=crop" class="w-20 h-20 rounded-lg object-cover">
        <div class="flex-1">
          <h3 class="font-bold text-sm text-gray-900">炸云吞 (Wantán Frito 10pcs)</h3>
          <p class="text-xs text-gray-500 mt-0.5">外皮金黄香脆，配特调酱油</p>
          <div class="text-sm font-bold text-red-600 mt-1">$3.500 CLP</div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="changeQty(3, -1)" class="w-8 h-8 rounded-full bg-gray-200 text-gray-700 font-bold flex items-center justify-center text-lg active:scale-95">-</button>
          <span id="qty-3" class="text-base font-bold w-4 text-center">0</span>
          <button onclick="changeQty(3, 1)" class="w-8 h-8 rounded-full bg-red-600 text-white font-bold flex items-center justify-center text-lg active:scale-95">+</button>
        </div>
      </div>

    </div>
  </main>

  <!-- 底部结算栏 -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex items-center justify-between shadow-lg z-20">
    <div>
      <div class="text-xs text-gray-500">已选金额：</div>
      <div class="text-xl font-bold text-red-600">$<span id="total-price">0</span> CLP</div>
    </div>
    <button onclick="openCheckoutModal()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-6 rounded-full shadow">
      去结算 (<span id="total-count">0</span>)
    </button>
  </footer>

  <!-- 结算弹窗 -->
  <div id="checkout-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-30 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">完善点单信息</h3>
        <button onclick="closeCheckoutModal()" class="text-gray-400 text-2xl font-bold">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">number *</label>
          <input id="cust-name" type="text" placeholder="例如：Long" class="w-full border rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">telefono *</label>
          <input id="cust-phone" type="tel" placeholder="+56 9 1234 5678" class="w-full border rounded-lg p-2.5 text-sm">
        </div>
        <div id="address-box">
          <label class="block text-xs font-semibold text-gray-600 mb-1">direccion*</label>
        
          <input id="cust-address" type="text" placeholder="calle y numero" class="w-full border rounded-lg p-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">observaciones*</label>
          <input id="cust-notes" type="text" placeholder="如：少放辣、不要餐具等" class="w-full border rounded-lg p-2.5 text-sm">
        </div>
      </div>

      <div class="mt-5">
        <button onclick="sendOrderToWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2">
          <span>发往 WhatsApp 确认下单</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // 你的接单 WhatsApp 手机号（国家代码 56 + 9 位数字）
    const MY_WHATSAPP_NUMBER = "56974142810";

    const dishInfo = {
      1: { name: "蒙古牛肉 (Carne Mongoliana)", price: 7500 },
      2: { name: "炒饭 (Arroz Chaufán)", price: 4500 },
      3: { name: "炸云吞 (Wantán Frito 10pcs)", price: 3500 }
    };

    let counts = { 1: 0, 2: 0, 3: 0 };
    let orderType = 'delivery';

    function changeQty(id, delta) {
      counts[id] = Math.max(0, counts[id] + delta);
      document.getElementById('qty-' + id).innerText = counts[id];
      calculateTotals();
    }

    function calculateTotals() {
      let totalCount = 0;
      let totalPrice = 0;
      for (let id in counts) {
        totalCount += counts[id];
        totalPrice += counts[id] * dishInfo[id].price;
      }
      document.getElementById('total-count').innerText = totalCount;
      document.getElementById('total-price').innerText = totalPrice.toLocaleString();
    }

    function setOrderType(type) {
      orderType = type;
      const btnDel = document.getElementById('btn-delivery');
      const btnPick = document.getElementById('btn-pickup');
      const addrBox = document.getElementById('address-box');

      if (type === 'delivery') {
        btnDel.className = "py-2 rounded-lg border-2 border-red-600 bg-red-50 text-red-600 font-bold text-sm";
        btnPick.className = "py-2 rounded-lg border border-gray-300 text-gray-600 font-bold text-sm";
        addrBox.classList.remove('hidden');
      } else {
        btnPick.className = "py-2 rounded-lg border-2 border-red-600 bg-red-50 text-red-600 font-bold text-sm";
        btnDel.className = "py-2 rounded-lg border border-gray-300 text-gray-600 font-bold text-sm";
        addrBox.classList.add('hidden');
      }
    }

    function openCheckoutModal() {
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      if (total === 0) {
        alert("购物车还是空的，请先挑选菜品！");
        return;
      }
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function sendOrderToWhatsApp() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const notes = document.getElementById('cust-notes').value.trim();

      if (!name || !phone) {
        alert("请填写姓名和联系电话！");
        return;
      }
      if (orderType === 'delivery' && !address) {
        alert("选择送货上门必须填写配送地址！");
        return;
      }

      let itemsSummary = [];
      let totalAmount = 0;
      for (let id in counts) {
        if (counts[id] > 0) {
          const item = dishInfo[id];
          const subtotal = item.price * counts[id];
          totalAmount += subtotal;
          itemsSummary.push(`• ${item.name} x ${counts[id]} = $${subtotal.toLocaleString()} CLP`);
        }
      }

      const typeLabel = orderType === 'delivery' 
        ? `🛵 *方式*：送货上门\n📍 *地址*：${address}` 
        : `🛍️ *方式*：到店自取`;

      const message = `🛎️ *【新点单通知】*
-----------------------
👤 *顾客*：${name}
📞 *电话*：${phone}
${typeLabel}
📝 *备注*：${notes || '无'}
-----------------------
🛒 *商品列表*：
${itemsSummary.join('\n')}
-----------------------
💰 *总计*：$${totalAmount.toLocaleString()} CLP`;

      window.location.href = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    }
  </script>
</body>
</html>
