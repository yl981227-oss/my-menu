<!DOCTYPE html>
<html lang="es" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <title id="page-title">Menú Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 动态品牌主题注入变量 */
    :root {
      --color-primary: #DC2626;
      --color-primary-dark: #991B1B;
      --color-primary-light: #FEE2E2;
      --color-accent: #F59E0B;
    }
    .theme-bg-primary { background-color: var(--color-primary); }
    .theme-text-primary { color: var(--color-primary); }
    .theme-border-primary { border-color: var(--color-primary); }
    .theme-bg-light { background-color: var(--color-primary-light); }
  </style>
</head>
<body class="bg-[#F8F9FA] text-gray-800 h-screen flex flex-col overflow-hidden notranslate" translate="no">

  <!-- ======================================================== -->
  <!-- 🎨 店铺个性化配置中心 (每家店只需在这里修改几行即可全套换装) -->
  <!-- ======================================================== -->
  <script>
    const STORE_CONFIG = {
      // 1. 基础品牌信息
      storeName: "DRAGÓN DE ORO",                // 店铺名称
      slogan: "Comida China Tradicional & Sushi", // 宣传标语
      logoIcon: "🐉",                           // 店标 Emoji 或图片 URL
      whatsapp: "56974142810",                   // 该店接单 WhatsApp 电话号码
      orderCodePrefix: "DRAGON",                 // 订单号前缀 (如 DRAGON-1082)

      // 2. 视觉主题预设: 'red'(中国红) | 'black_gold'(黑金) | 'orange'(活力橙) | 'emerald'(和风绿)
      theme: "black_gold",

      // 3. 门店运营参数
      ratingText: "⭐ 4.9 (210+ reseñas)",       // 评分背书
      prepTimeText: "⏱️ 20-30 min",             // 出餐预估时间
      deliveryFee: 1800,                         // 配送费 (CLP)
      promoBanner: "🎁 ¡Por compras sobre $20.000 te regalamos Wantán frito!" // 顶部跑马灯特惠
    };

    // 主题色彩映射表
    const THEMES = {
      red: {
        primary: "#DC2626",
        primaryDark: "#991B1B",
        primaryLight: "#FEF2F2",
        headerGradient: "from-red-900 via-rose-800 to-red-700",
        btnGradient: "from-red-600 to-rose-600"
      },
      black_gold: {
        primary: "#D97706",
        primaryDark: "#18181B",
        primaryLight: "#FFFBEB",
        headerGradient: "from-zinc-950 via-zinc-900 to-stone-900",
        btnGradient: "from-amber-500 to-amber-600"
      },
      orange: {
        primary: "#EA580C",
        primaryDark: "#9A3412",
        primaryLight: "#FFF7ED",
        headerGradient: "from-orange-800 via-orange-600 to-amber-600",
        btnGradient: "from-orange-600 to-amber-500"
      },
      emerald: {
        primary: "#059669",
        primaryDark: "#064E3B",
        primaryLight: "#ECFDF5",
        headerGradient: "from-emerald-950 via-teal-900 to-emerald-800",
        btnGradient: "from-emerald-600 to-teal-600"
      }
    };
  </script>

  <!-- 1. 顶部个性化品牌招牌 -->
  <header id="store-header" class="bg-gradient-to-r text-white px-3.5 pt-3 pb-2.5 shadow-lg shrink-0 z-20 transition-all">
    <div class="flex justify-between items-center mb-2">
      <div class="flex items-center gap-2.5">
        <div id="store-logo" class="w-11 h-11 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-2xl shadow-inner shrink-0">
          🐉
        </div>
        <div>
          <h1 id="store-title" class="text-base font-black tracking-tight leading-none text-white drop-shadow-sm">
            DRAGÓN DE ORO
          </h1>
          <p id="store-slogan" class="text-[11px] text-white/80 font-medium mt-1 leading-tight line-clamp-1">
            Comida China Tradicional & Sushi
          </p>
        </div>
      </div>
      <!-- 营业状态指示灯 -->
      <div class="flex items-center gap-1.5 bg-emerald-500/20 backdrop-blur-md border border-emerald-400/30 px-2.5 py-1 rounded-full shadow-sm">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-[10px] font-black text-emerald-100 tracking-wide">Abierto</span>
      </div>
    </div>

    <!-- 顶部特惠横幅 (Promo Hook) -->
    <div id="store-promo-bar" class="mb-2 bg-black/25 backdrop-blur-sm border border-white/15 px-2.5 py-1 rounded-xl text-[10px] font-bold text-amber-200 flex items-center gap-1.5">
      <span class="shrink-0">📢</span>
      <span id="store-promo-text" class="truncate leading-tight"></span>
    </div>

    <!-- 信任特征胶囊标签 -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar text-[10px] font-semibold text-white/90">
      <span id="badge-rating" class="bg-black/20 backdrop-blur-sm px-2.5 py-1 rounded-xl border border-white/10 flex items-center gap-1 whitespace-nowrap">
        ⭐ 4.9 (210+ reseñas)
      </span>
      <span id="badge-preptime" class="bg-black/20 backdrop-blur-sm px-2.5 py-1 rounded-xl border border-white/10 flex items-center gap-1 whitespace-nowrap">
        ⏱️ 20-30 min
      </span>
      <span id="badge-delivery" class="bg-black/20 backdrop-blur-sm px-2.5 py-1 rounded-xl border border-white/10 flex items-center gap-1 whitespace-nowrap">
        🛵 Envío $1.800 CLP
      </span>
    </div>

    <!-- 实时菜品搜索框 -->
    <div class="mt-2 relative">
      <input id="quick-search" oninput="filterMenuItems()" type="text" placeholder="¿Qué se te antoja hoy? (ej. Mongoliana, Roll, Arroz...)" class="w-full bg-black/25 placeholder-white/60 text-white text-xs rounded-xl py-2 pl-8 pr-3 outline-none border border-white/15 focus:bg-black/40 focus:border-white/40 transition">
      <span class="absolute left-2.5 top-2.5 text-xs text-white/70">🔍</span>
    </div>
  </header>

  <!-- 2. 主分类切换卡槽 (Comida China vs Sushi) -->
  <nav class="bg-white px-3 py-2 border-b border-gray-150 shrink-0 z-20 shadow-sm">
    <div class="bg-gray-100 p-1 rounded-2xl flex gap-1 border border-gray-200/60">
      <button id="btn-tab-china" onclick="switchMainMenu('china')" class="flex-1 py-2 rounded-xl text-xs font-black shadow-sm flex items-center justify-center gap-1.5 transition-all duration-200">
        <span class="text-sm">🥢</span> Comida China
      </button>
      <button id="btn-tab-sushi" onclick="switchMainMenu('sushi')" class="flex-1 py-2 rounded-xl text-xs font-bold text-gray-500 hover:text-gray-800 flex items-center justify-center gap-1.5 transition-all duration-200">
        <span class="text-sm">🍣</span> Sushi
      </button>
    </div>
  </nav>

  <!-- 3. 双栏布局：左侧品类直达 + 右侧菜品瀑布 -->
  <div class="flex flex-1 overflow-hidden">
    <!-- 左侧竖向导航栏 -->
    <aside id="sidebar-categories" class="w-24 bg-[#F1F3F5] border-r border-gray-200/80 overflow-y-auto no-scrollbar shrink-0 flex flex-col py-1.5">
      <!-- 由 JS 渲染 -->
    </aside>

    <!-- 右侧菜品卡片展示区 -->
    <main id="menu-container" class="flex-1 overflow-y-auto px-2.5 pt-2 pb-32 space-y-5 bg-[#F8F9FA]">
      <div class="text-center py-24 text-gray-400 text-xs">Cargando delicias...</div>
    </main>
  </div>

  <!-- 4. 悬浮胶囊购物车 (Floating Dock Bar) -->
  <div class="fixed bottom-3 left-3 right-3 z-30 pointer-events-none">
    <footer class="pointer-events-auto max-w-md mx-auto bg-gray-900/95 backdrop-blur-md text-white p-3 rounded-2xl shadow-[0_12px_30px_rgba(0,0,0,0.35)] border border-white/10 flex items-center justify-between transition-transform active:scale-[0.99]">
      <div class="flex items-center gap-3 pl-1">
        <div class="relative">
          <div id="cart-icon-box" class="w-10 h-10 rounded-xl theme-bg-primary flex items-center justify-center text-lg shadow-md">
            🛒
          </div>
          <span id="cart-total-count" class="absolute -top-1.5 -right-1.5 bg-amber-400 text-gray-950 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-md">0</span>
        </div>
        <div>
          <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Subtotal</div>
          <div class="text-base font-black tracking-tight text-white leading-tight">
            $ <span id="cart-total-price">0</span> <span class="text-[10px] font-normal text-gray-400">CLP</span>
          </div>
        </div>
      </div>
      <button id="btn-checkout-dock" onclick="openCheckoutModal()" class="text-white font-extrabold py-2.5 px-5 rounded-xl shadow-lg text-xs flex items-center gap-1.5 active:scale-95 transition">
        <span>Ver pedido</span>
        <span>→</span>
      </button>
    </footer>
  </div>

  <!-- 5. 菜品定制弹窗 (Option Modal) -->
  <div id="option-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[85vh] overflow-y-auto">
      <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-3"></div>

      <div class="flex justify-between items-start border-b pb-3 mb-3.5">
        <div>
          <h3 id="opt-dish-name" class="text-base font-black text-gray-900 leading-snug">Plato</h3>
          <p id="opt-dish-desc" class="text-xs text-gray-500 mt-0.5 leading-relaxed">Descripción</p>
        </div>
        <button onclick="closeOptionModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center font-bold text-lg leading-none shrink-0">&times;</button>
      </div>

      <!-- 便当配餐加价选项 -->
      <div id="colacion-side-box" class="hidden mb-4 bg-gray-50 p-3 rounded-2xl border border-gray-100">
        <label class="block text-xs font-black text-gray-800 mb-2">🍱 Acompañamiento *</label>
        <div class="space-y-1.5 text-xs">
          <label class="flex items-center justify-between p-2.5 rounded-xl border bg-white cursor-pointer hover:border-gray-400">
            <div class="flex items-center gap-2">
              <input type="radio" name="side-choice" value="Con Arroz" checked data-addprice="0">
              <span class="font-bold">Arroz Chaufán / Blanco</span>
            </div>
            <span class="text-[11px] font-black text-gray-400">+$0</span>
          </label>
          <label class="flex items-center justify-between p-2.5 rounded-xl border bg-white cursor-pointer hover:border-gray-400">
            <div class="flex items-center gap-2">
              <input type="radio" name="side-choice" value="Con Papas Fritas" data-addprice="500">
              <span class="font-bold">Papas Fritas</span>
            </div>
            <span class="text-[11px] font-black theme-text-primary">+ $500</span>
          </label>
          <label class="flex items-center justify-between p-2.5 rounded-xl border bg-white cursor-pointer hover:border-gray-400">
            <div class="flex items-center gap-2">
              <input type="radio" name="side-choice" value="Con Fideo Chaumín" data-addprice="800">
              <span class="font-bold">Fideo Chaumín</span>
            </div>
            <span class="text-[11px] font-black theme-text-primary">+ $800</span>
          </label>
        </div>
      </div>

      <!-- 中餐专属定制 -->
      <div id="box-china-options" class="space-y-4">
        <div>
          <label class="block text-xs font-black text-gray-800 mb-2">🌶️ Nivel de Ají *</label>
          <div class="grid grid-cols-3 gap-2 text-xs">
            <label class="flex items-center justify-center py-2.5 px-2 rounded-xl border text-center cursor-pointer has-[:checked]:theme-bg-light has-[:checked]:theme-text-primary has-[:checked]:theme-border-primary font-bold transition">
              <input type="radio" name="opt-aji" value="Sin ají" checked class="hidden">
              <span>Sin ají</span>
            </label>
            <label class="flex items-center justify-center py-2.5 px-2 rounded-xl border text-center cursor-pointer has-[:checked]:theme-bg-light has-[:checked]:theme-text-primary has-[:checked]:theme-border-primary font-bold transition">
              <input type="radio" name="opt-aji" value="Con ají" class="hidden">
              <span>Con ají 🔥</span>
            </label>
            <label class="flex items-center justify-center py-2.5 px-2 rounded-xl border text-center cursor-pointer has-[:checked]:theme-bg-light has-[:checked]:theme-text-primary has-[:checked]:theme-border-primary font-bold transition">
              <input type="radio" name="opt-aji" value="Ají aparte" class="hidden">
              <span>Ají aparte</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-black text-gray-800 mb-2">🧂 Preferencias de cocina</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="pref-sal" value="Bajo en sal" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Bajo en sal</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="pref-sillao" value="Poco sillao" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Poco sillao</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="pref-cebollin" value="Sin cebollín" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Sin cebollín</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="pref-diente" value="Sin diente" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Sin diente dragón</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 寿司专属定制 -->
      <div id="box-sushi-options" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-black text-gray-800 mb-2">🥢 Salsas incluidas para Sushi</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50 cursor-pointer">
              <input type="checkbox" id="sushi-soya" value="Salsa Soya" checked class="w-4 h-4 rounded">
              <span class="font-bold">Soya (酱油)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50 cursor-pointer">
              <input type="checkbox" id="sushi-teriyaki" value="Salsa Teriyaki" checked class="w-4 h-4 rounded">
              <span class="font-bold">Teriyaki (甜酱)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="sushi-wasabi" value="Wasabi" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Wasabi (芥末)</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="sushi-jengibre" value="Jengibre" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Jengibre (红姜)</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-black text-gray-800 mb-2">🥢 ¿Deseas Palitos de madera?</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center justify-center py-2.5 rounded-xl border text-center cursor-pointer has-[:checked]:theme-bg-light has-[:checked]:theme-text-primary has-[:checked]:theme-border-primary font-bold transition">
              <input type="radio" name="opt-palitos" value="Con palitos" checked class="hidden">
              <span>🥢 Sí, con palitos</span>
            </label>
            <label class="flex items-center justify-center py-2.5 rounded-xl border text-center cursor-pointer has-[:checked]:theme-bg-light has-[:checked]:theme-text-primary has-[:checked]:theme-border-primary font-bold transition">
              <input type="radio" name="opt-palitos" value="Sin palitos" class="hidden">
              <span>🌱 Sin palitos</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-black text-gray-800 mb-2">🥑 Detalles del Roll</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="sushi-no-queso" value="Sin queso crema" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Sin queso crema</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="sushi-no-cebollin" value="Sin cebollín" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Sin cebollín</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="sushi-no-sesamo" value="Sin sésamo" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Sin sésamo</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl border bg-gray-50/60 cursor-pointer">
              <input type="checkbox" id="sushi-bien-dorado" value="Bien dorado/crujiente" class="w-4 h-4 rounded">
              <span class="font-semibold text-gray-700">Bien dorado 🔥</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 饮料专属定制 -->
      <div id="box-drink-options" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-black text-gray-800 mb-2">🥤 Temperatura *</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center justify-center py-3 rounded-xl border text-center cursor-pointer has-[:checked]:theme-bg-light has-[:checked]:theme-text-primary has-[:checked]:theme-border-primary font-bold transition">
              <input type="radio" name="opt-drink-temp" value="Fría / Helada" checked class="hidden">
              <span>❄️ Bien Fría / Helada</span>
            </label>
            <label class="flex items-center justify-center py-3 rounded-xl border text-center cursor-pointer has-[:checked]:theme-bg-light has-[:checked]:theme-text-primary has-[:checked]:theme-border-primary font-bold transition">
              <input type="radio" name="opt-drink-temp" value="Al tiempo" class="hidden">
              <span>🌤️ Al tiempo</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 数量步进器 -->
      <div class="flex items-center justify-between border-t border-gray-150 pt-3.5 mt-4 mb-4">
        <span class="text-xs font-black text-gray-700">Cantidad:</span>
        <div class="flex items-center gap-3 bg-gray-100 p-1 rounded-2xl border border-gray-200">
          <button onclick="changeModalQty(-1)" class="w-8 h-8 rounded-xl bg-white text-gray-800 font-black shadow-sm flex items-center justify-center text-sm active:scale-90 transition">-</button>
          <span id="opt-modal-qty" class="font-black text-sm px-2">1</span>
          <button id="btn-modal-plus" onclick="changeModalQty(1)" class="w-8 h-8 rounded-xl theme-bg-primary text-white font-black shadow-md flex items-center justify-center text-sm active:scale-90 transition">+</button>
        </div>
      </div>

      <button id="btn-modal-add" onclick="confirmAddToCart()" class="w-full text-white font-black py-3.5 rounded-2xl shadow-xl text-xs flex items-center justify-center gap-2 active:scale-95 transition">
        <span>Agregar al pedido</span>
      </button>
    </div>
  </div>

  <!-- 6. 结账结算弹窗 (Checkout Modal) -->
  <div id="checkout-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-3"></div>

      <div class="flex justify-between items-center mb-3 border-b pb-2.5">
        <div>
          <h3 class="text-base font-black text-gray-900">Resumen de tu Pedido</h3>
          <p class="text-[11px] text-gray-400">Verifica los datos antes de enviar a WhatsApp</p>
        </div>
        <button onclick="closeCheckoutModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center font-bold text-lg leading-none shrink-0">&times;</button>
      </div>

      <div id="cart-items-preview" class="space-y-2 mb-3.5 max-h-40 overflow-y-auto divide-y divide-gray-100 text-xs pr-1"></div>

      <!-- 履约方式选择 -->
      <div class="mb-3.5 bg-gray-50 p-2.5 rounded-2xl border border-gray-100">
        <label class="block text-xs font-black text-gray-800 mb-2">🛵 Método de entrega *</label>
        <div class="grid grid-cols-2 gap-2 text-xs font-bold">
          <button type="button" id="btn-pickup" onclick="setOrderType('pickup')" class="p-2.5 rounded-xl border-2 theme-border-primary bg-white theme-text-primary shadow-sm text-center transition">
            🛍️ Para llevar<br><span class="text-[10px] font-normal text-gray-500">Retiro en local</span>
          </button>
          <button type="button" id="btn-delivery" onclick="setOrderType('delivery')" class="p-2.5 rounded-xl border border-gray-200 bg-white text-gray-600 text-center transition">
            🛵 Delivery<br><span id="label-delivery-fee" class="text-[10px] font-semibold theme-text-primary"></span>
          </button>
        </div>
      </div>

      <!-- 顾客表单信息填写 -->
      <div class="space-y-2.5 text-xs">
        <div>

      { id: "cat-sushi-hot", title: "🔥 HOT ROLLS (Fritos)", icon: "🔥", short: "Hot Rolls" },

    // 动态应用品牌主题和参数

      btnModalAdd.className = "w-full bg-gradient-to-r " + t.btnGradient + " text-white font-black py-3.5 rounded-2xl shadow-xl text-xs flex items-center justify-center gap-2 active:scale-95 transition";

    function switchMainMenu(mode) {
      currentMenuMode = mode;
      const btnChina = document.getElementById('btn-tab-china');
      const btnSushi = document.getElementById('btn-tab-sushi');

      if (mode === 'china') {
        btnChina.className = "flex-1 py-2 rounded-xl text-xs font-black bg-white theme-text-primary shadow-sm flex items-center justify-center gap-1.5 transition-all duration-200";
        btnSushi.className = "flex-1 py-2 rounded-xl text-xs font-bold text-gray-500 hover:text-gray-800 flex items-center justify-center gap-1.5 transition-all duration-200";
      } else {
        btnSushi.className = "flex-1 py-2 rounded-xl text-xs font-black bg-white theme-text-primary shadow-sm flex items-center justify-center gap-1.5 transition-all duration-200";
        btnChina.className = "flex-1 py-2 rounded-xl text-xs font-bold text-gray-500 hover:text-gray-800 flex items-center justify-center gap-1.5 transition-all duration-200";
      }
      renderCurrentMenu();
    }

    async function loadLiveMenu() {
      const container = document.getElementById('menu-container');
      const { data, error } = await db.from('dishes').select('*').order('id', { ascending: true });

      if (error) {
        container.innerHTML = '<div class="text-center py-20 text-red-500 text-xs">Error de conexión: ' + error.message + '</div>';
        return;
      }

      allDishes = data || [];
      renderCurrentMenu();
    }

    function renderCurrentMenu() {
      const activeCats = currentMenuMode === 'china' ? categoriesChina : categoriesSushi;
      renderSidebar(activeCats);
      renderDishesList(activeCats);
    }

    function renderSidebar(cats) {
      const sidebar = document.getElementById('sidebar-categories');
      let html = '';
      cats.forEach((cat, idx) => {
        const isFirst = idx === 0;
        const activeClass = isFirst ? 'bg-white theme-text-primary font-black border-l-4 theme-border-primary shadow-sm' : 'text-gray-500 font-semibold hover:bg-gray-200/60';
        html += '<button id="side-btn-' + cat.id + '" onclick="scrollToSection(\'' + cat.id + '\')" class="w-full text-left px-2 py-3 text-[11px] transition flex flex-col items-center text-center gap-1 border-b border-gray-200/50 ' + activeClass + '">';
        html += '  <span class="text-lg leading-none">' + cat.icon + '</span>';
        html += '  <span class="leading-tight break-words text-[10px]">' + cat.short + '</span>';
        html += '</button>';
      });
      sidebar.innerHTML = html;
    }

    function renderDishesList(cats) {
      const container = document.getElementById('menu-container');
      let html = '';

      cats.forEach(cat => {
        const items = allDishes.filter(d => d.category === cat.id);
        if (items.length === 0) return;

        html += '<section id="' + cat.id + '" class="scroll-mt-3">';
        html += '<div class="flex items-center gap-2 mb-2 px-1">';
        html += '  <span class="text-sm">' + cat.icon + '</span>';
        html += '  <h2 class="text-xs font-black text-gray-800 uppercase tracking-wider">' + cat.title + '</h2>';
        html += '  <span class="text-[10px] font-bold text-gray-400 ml-auto bg-gray-200/60 px-2 py-0.5 rounded-full">' + items.length + '</span>';
        html += '</div>';
        html += '<div class="space-y-2">';

        items.forEach(dish => {
          const isSoldOut = !dish.is_available;
          const clickAttr = isSoldOut ? '' : 'onclick="openOptionModal(' + dish.id + ')"';
          const cardStyle = isSoldOut 
            ? 'bg-white/60 p-3 rounded-2xl border border-gray-200/50 flex justify-between items-center opacity-60 cursor-not-allowed' 
            : 'bg-white p-3 rounded-2xl border border-gray-150 shadow-[0_2px_8px_rgba(0,0,0,0.03)] hover:shadow-md flex justify-between items-center active:scale-[0.99] transition cursor-pointer';
          const badge = isSoldOut ? '<span class="bg-red-600 text-white text-[8px] px-1.5 py-0.5 rounded-md font-black tracking-wider">AGOTADO</span>' : '';
          const btnBg = isSoldOut ? 'bg-gray-200 text-gray-400' : 'theme-bg-primary text-white shadow-md active:scale-90';
          const btnIcon = isSoldOut ? '✕' : '+';
          const descText = dish.description || '';
          const priceStr = Number(dish.price).toLocaleString('es-CL');

          html += '<div ' + clickAttr + ' class="' + cardStyle + ' dish-card" data-dishname="' + dish.name.toLowerCase() + '" data-dishdesc="' + descText.toLowerCase() + '">';
          html += '  <div class="flex-1 pr-3">';
          html += '    <div class="flex items-center gap-1.5">';
          html += '      <h3 class="font-extrabold text-xs text-gray-900 leading-snug">' + dish.name + '</h3>';
          html +=        badge;
          html += '    </div>';
          if (descText) {
            html += '    <p class="text-[10px] text-gray-400 mt-0.5 line-clamp-2 leading-tight">' + descText + '</p>';
          }
          html += '    <div class="mt-1.5 flex items-baseline gap-1">';
          html += '      <span class="text-[10px] font-bold theme-text-primary">$</span>';
          html += '      <span class="text-sm font-black theme-text-primary tracking-tight">' + priceStr + '</span>';
          html += '      <span class="text-[9px] font-semibold text-gray-400">CLP</span>';
          html += '    </div>';
          html += '  </div>';
          html += '  <button class="w-8 h-8 rounded-full ' + btnBg + ' font-black text-base flex items-center justify-center shrink-0 transition">' + btnIcon + '</button>';
          html += '</div>';
        });

        html += '</div></section>';
      });

      if (!html) {
        html = '<div class="text-center py-20 text-gray-400 text-xs">No hay platos disponibles por el momento.</div>';
      }

      container.innerHTML = html;
    }

    function filterMenuItems() {
      const q = document.getElementById('quick-search').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.dish-card');
      cards.forEach(card => {
        const name = card.getAttribute('data-dishname') || '';
        const desc = card.getAttribute('data-dishdesc') || '';
        if (name.includes(q) || desc.includes(q)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function scrollToSection(catId) {
      const el = document.getElementById(catId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.querySelectorAll('#sidebar-categories button').forEach(btn => {
          btn.className = "w-full text-left px-2 py-3 text-[11px] transition flex flex-col items-center text-center gap-1 border-b border-gray-200/50 text-gray-500 font-semibold hover:bg-gray-200/60";
        });
        const activeBtn = document.getElementById('side-btn-' + catId);
        if (activeBtn) {
          activeBtn.className = "w-full text-left px-2 py-3 text-[11px] transition flex flex-col items-center text-center gap-1 border-b border-gray-200/50 bg-white theme-text-primary font-black border-l-4 theme-border-primary shadow-sm";
        }
      }
    }

    function openOptionModal(dishId) {
      currentSelectedDish = allDishes.find(i => i.id === dishId);
      if (!currentSelectedDish || !currentSelectedDish.is_available) return;

      modalQty = 1;
      document.getElementById('opt-modal-qty').innerText = modalQty;
      document.getElementById('opt-dish-name').innerText = currentSelectedDish.name;
      document.getElementById('opt-dish-desc').innerText = currentSelectedDish.description || '';

      const isSushi = currentSelectedDish.category.startsWith('cat-sushi-');
      const isDrink = currentSelectedDish.category === 'cat-bebidas';
      const isColacion = currentSelectedDish.is_colacion;

      document.getElementById('colacion-side-box').classList.toggle('hidden', !isColacion);
      document.getElementById('box-china-options').classList.toggle('hidden', isSushi || isDrink);
      document.getElementById('box-sushi-options').classList.toggle('hidden', !isSushi);
      document.getElementById('box-drink-options').classList.toggle('hidden', !isDrink);

      if (isSushi) {
        document.getElementById('sushi-soya').checked = true;
        document.getElementById('sushi-teriyaki').checked = true;
        document.getElementById('sushi-wasabi').checked = false;
        document.getElementById('sushi-jengibre').checked = false;
        document.querySelector('input[name="opt-palitos"][value="Con palitos"]').checked = true;
        document.getElementById('sushi-no-queso').checked = false;
        document.getElementById('sushi-no-cebollin').checked = false;
        document.getElementById('sushi-no-sesamo').checked = false;
        document.getElementById('sushi-bien-dorado').checked = false;
      } else if (isDrink) {
        document.querySelector('input[name="opt-drink-temp"][value="Fría / Helada"]').checked = true;
      } else {
        document.querySelector('input[name="opt-aji"][value="Sin ají"]').checked = true;
        document.getElementById('pref-sal').checked = false;
        document.getElementById('pref-sillao').checked = false;
        document.getElementById('pref-cebollin').checked = false;
        document.getElementById('pref-diente').checked = false;
      }

      document.getElementById('option-modal').classList.remove('hidden');
    }

    function closeOptionModal() {
      document.getElementById('option-modal').classList.add('hidden');
    }

    function changeModalQty(delta) {
      modalQty = Math.max(1, modalQty + delta);
      document.getElementById('opt-modal-qty').innerText = modalQty;
    }

    function confirmAddToCart() {
      if (!currentSelectedDish) return;

      let extraPrice = 0;
      let optionsList = [];

      if (currentSelectedDish.is_colacion) {
        const selectedSide = document.querySelector('input[name="side-choice"]:checked');
        if (selectedSide) {
          optionsList.push(selectedSide.value);
          extraPrice += parseInt(selectedSide.dataset.addprice || 0);
        }
      }

      const isSushi = currentSelectedDish.category.startsWith('cat-sushi-');
      const isDrink = currentSelectedDish.category === 'cat-bebidas';

      if (isSushi) {
        let salsas = [];
        if (document.getElementById('sushi-soya').checked) salsas.push('Soya');
        if (document.getElementById('sushi-teriyaki').checked) salsas.push('Teriyaki');
        if (document.getElementById('sushi-wasabi').checked) salsas.push('Wasabi');
        if (document.getElementById('sushi-jengibre').checked) salsas.push('Jengibre');
        if (salsas.length > 0) optionsList.push('Salsas: ' + salsas.join(', '));

        const palitosChoice = document.querySelector('input[name="opt-palitos"]:checked').value;
        optionsList.push(palitosChoice);

        if (document.getElementById('sushi-no-queso').checked) optionsList.push('Sin queso crema');
        if (document.getElementById('sushi-no-cebollin').checked) optionsList.push('Sin cebollín');
        if (document.getElementById('sushi-no-sesamo').checked) optionsList.push('Sin sésamo');
        if (document.getElementById('sushi-bien-dorado').checked) optionsList.push('Bien dorado');
      } else if (isDrink) {
        const tempChoice = document.querySelector('input[name="opt-drink-temp"]:checked').value;
        optionsList.push(tempChoice);
      } else {
        const ajiChoice = document.querySelector('input[name="opt-aji"]:checked').value;
        if (ajiChoice !== 'Sin ají') optionsList.push(ajiChoice);

        if (document.getElementById('pref-sal').checked) optionsList.push('Bajo en sal');
        if (document.getElementById('pref-sillao').checked) optionsList.push('Poco sillao');
        if (document.getElementById('pref-cebollin').checked) optionsList.push('Sin cebollín');
        if (document.getElementById('pref-diente').checked) optionsList.push('Sin diente');
      }

      const finalUnitPrice = currentSelectedDish.price + extraPrice;

      cart.push({
        dishId: currentSelectedDish.id,
        name: currentSelectedDish.name,
        unitPrice: finalUnitPrice,
        qty: modalQty,
        options: optionsList
      });

      closeOptionModal();
      updateCartUI();
    }

    function updateCartUI() {
      let totalQty = 0;
      let totalPrice = 0;
      cart.forEach(item => {
        totalQty += item.qty;
        totalPrice += item.unitPrice * item.qty;
      });
      document.getElementById('cart-total-count').innerText = totalQty;
      document.getElementById('cart-total-price').innerText = totalPrice.toLocaleString('es-CL');
    }

    function setOrderType(type) {
      orderType = type;
      const btnPick = document.getElementById('btn-pickup');
      const btnDel = document.getElementById('btn-delivery');
      const addrBox = document.getElementById('address-box');

      if (type === 'pickup') {
        btnPick.className = "p-2.5 rounded-xl border-2 theme-border-primary bg-white theme-text-primary shadow-sm text-center transition";
        btnDel.className = "p-2.5 rounded-xl border border-gray-200 bg-white text-gray-600 text-center transition";
        addrBox.classList.add('hidden');
      } else {
        btnDel.className = "p-2.5 rounded-xl border-2 theme-border-primary bg-white theme-text-primary shadow-sm text-center transition";
        btnPick.className = "p-2.5 rounded-xl border border-gray-200 bg-white text-gray-600 text-center transition";
        addrBox.classList.remove('hidden');
      }
      refreshCheckoutTotal();
    }

    function toggleCashInput() {
      const method = document.getElementById('pay-method').value;
      const cashBox = document.getElementById('cash-amount-box');
      if (method === 'efectivo') cashBox.classList.remove('hidden');
      else cashBox.classList.add('hidden');
    }

    function refreshCheckoutTotal() {
      let subtotal = 0;
      cart.forEach(item => {
        subtotal += item.unitPrice * item.qty;
      });
      const deliveryFee = (orderType === 'delivery') ? STORE_CONFIG.deliveryFee : 0;
      const grandTotal = subtotal + deliveryFee;
      document.getElementById('modal-checkout-total').innerText = grandTotal.toLocaleString('es-CL');
    }

    function openCheckoutModal() {
      if (cart.length === 0) {
        alert("El carrito está vacío. Agrega platos antes de continuar.");
        return;
      }
      const container = document.getElementById('cart-items-preview');
      let previewHtml = '';
      cart.forEach((item, index) => {
        const itemTotal = (item.unitPrice * item.qty).toLocaleString('es-CL');
        const optText = item.options.length > 0 ? '<div class="text-[10px] text-gray-400 leading-tight mt-0.5">• ' + item.options.join(', ') + '</div>' : '';
        previewHtml += '<div class="py-2 flex justify-between items-start">';
        previewHtml += '  <div class="flex-1 pr-2">';
        previewHtml += '    <div class="font-extrabold text-gray-900 text-xs">' + item.qty + 'x ' + item.name + '</div>';
        previewHtml +=      optText;
        previewHtml += '    <div class="theme-text-primary font-black mt-0.5 text-xs">$ ' + itemTotal + ' CLP</div>';
        previewHtml += '  </div>';
        previewHtml += '  <button onclick="removeFromCart(' + index + ')" class="text-red-500 hover:text-red-700 text-[11px] px-2 py-1 font-bold rounded-lg bg-red-50">Quitar</button>';
        previewHtml += '</div>';
      });
      container.innerHTML = previewHtml;
      refreshCheckoutTotal();
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
      if (cart.length === 0) closeCheckoutModal();
      else openCheckoutModal();
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function getChileDateTime() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return { date: dd + '/' + mm + '/' + yyyy, time: hh + ':' + min };
    }

    function sendOrderToWhatsApp() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const method = document.getElementById('pay-method').value;
      const cashGiven = parseFloat(document.getElementById('cust-cash').value) || 0;
      const notes = document.getElementById('cust-notes').value.trim();

      if (!name || !phone) {
        alert("Por favor completa tu nombre y teléfono.");
        return;
      }
      if (orderType === 'delivery' && !address) {
        alert("Por favor ingresa tu dirección para el envío.");
        return;
      }

      // 生成带店铺自定义前缀的订单号
      const orderCode = STORE_CONFIG.orderCodePrefix + '-' + Math.floor(1000000000 + Math.random() * 9000000000);
      const dt = getChileDateTime();

      let subtotal = 0;
      let productsList = [];
      cart.forEach(item => {
        const itemTotal = item.unitPrice * item.qty;
        subtotal += itemTotal;
        let line = 'X' + item.qty + ' ' + item.name + ' $ ' + itemTotal.toLocaleString('es-CL');
        if (item.options.length > 0) line += '\n   • ' + item.options.join(', ');
        productsList.push(line);
      });

      const deliveryFee = (orderType === 'delivery') ? STORE_CONFIG.deliveryFee : 0;
      const total = subtotal + deliveryFee;

      let payDetail = "";
      if (method === 'efectivo') {
        if (cashGiven > total) {
          const vuelto = cashGiven - total;
          payDetail = 'Efectivo ' + total.toLocaleString('es-CL') + ' (monto recibido ' + cashGiven.toLocaleString('es-CL') + ', vuelto ' + vuelto.toLocaleString('es-CL') + ')';
        } else {
          payDetail = 'Efectivo exacto $ ' + total.toLocaleString('es-CL');
        }
      } else if (method === 'tarjeta') {
        payDetail = 'Tarjeta Débito/Crédito al recibir (POS)';
      } else {
        payDetail = 'Transferencia Bancaria';
      }

      const serviceType = orderType === 'pickup' ? 'Para llevar (Retiro en local)' : 'Delivery (Envío a domicilio)';
      const addressLine = orderType === 'delivery' ? '\nDirección: ' + address : '';

      const message = orderCode + '\n' +
        '📅 ' + dt.date + ' ⏰ ' + dt.time + '\n\n' +
        'Tipo de servicio: ' + serviceType + '\n\n' +
        'Nombre: ' + name + '\n' +
        'Teléfono: ' + phone + addressLine + '\n\n' +
        '📝 Productos\n' +
        productsList.join('\n') + '\n\n' +
        'Subtotal: $ ' + subtotal.toLocaleString('es-CL') + '\n' +
        'Entrega: $ ' + deliveryFee.toLocaleString('es-CL') + '\n' +
        'Total: $ ' + total.toLocaleString('es-CL') + '\n\n' +
        '💲 Pago\n' +
        'Estado del pago: No pagado\n' +
        'Total a pagar: $ ' + total.toLocaleString('es-CL') + '\n' +
        payDetail + '\n\n' +
        'Comentarios adicionales:\n' +
        (notes ? notes : 'Sin comentarios');

      window.location.href = 'https://wa.me/' + STORE_CONFIG.whatsapp + '?text=' + encodeURIComponent(message);
    }

    // 初始化运行
    applyStoreConfig();
    loadLiveMenu();
  </script>
