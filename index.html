<!DOCTYPE html>
<html lang="es" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <title>Menú Online - Comida China & Sushi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-hidden notranslate" translate="no">

  <!-- 1. 顶部招牌 -->
  <header class="bg-red-700 text-white px-3 py-2.5 shadow shrink-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="text-base font-black tracking-wide flex items-center gap-1.5">
        <span>🥢</span> RESTAURANT & SUSHI
      </h1>
      <p class="text-[10px] text-red-200 leading-tight">Pedidos por WhatsApp • Sin comisiones</p>
    </div>
    <span class="bg-red-800 text-[10px] px-2 py-0.5 rounded-full text-red-100 font-semibold border border-red-500">Abierto</span>
  </header>

  <!-- 2. 菜单大类切换器 (Comida China vs Sushi) -->
  <nav class="bg-white px-3 py-2 border-b shrink-0 z-20 flex gap-2 shadow-sm">
    <button id="btn-tab-china" onclick="switchMainMenu('china')" class="flex-1 py-1.5 rounded-xl text-xs font-black border-2 border-red-600 bg-red-50 text-red-700 flex items-center justify-center gap-1 shadow-sm transition">
      <span>🥢</span> Comida China
    </button>
    <button id="btn-tab-sushi" onclick="switchMainMenu('sushi')" class="flex-1 py-1.5 rounded-xl text-xs font-bold border border-gray-200 bg-gray-50 text-gray-600 flex items-center justify-center gap-1 transition">
      <span>🍣</span> Sushi
    </button>
  </nav>

  <!-- 3. 主界面布局：左侧竖向分类栏 + 右侧菜品列表 -->
  <div class="flex flex-1 overflow-hidden">
    <!-- 左侧竖向分类导航栏 -->
    <aside id="sidebar-categories" class="w-24 bg-gray-50 border-r border-gray-200 overflow-y-auto no-scrollbar shrink-0 flex flex-col py-1">
      <!-- 由 JS 动态渲染 -->
    </aside>

    <!-- 右侧菜品列表滚动展示区 -->
    <main id="menu-container" class="flex-1 overflow-y-auto p-2 pb-28 space-y-5">
      <div class="text-center py-20 text-gray-400 text-xs">Cargando menú actualizado...</div>
    </main>
  </div>

  <!-- 4. 底部常驻购物车条 -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t p-2.5 flex items-center justify-between shadow-2xl z-30">
    <div>
      <div class="text-[10px] text-gray-400">Total pedido:</div>
      <div class="text-base font-black text-red-600">$ <span id="cart-total-price">0</span> CLP</div>
    </div>
    <button onclick="openCheckoutModal()" class="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold py-2 px-4 rounded-xl shadow-md text-xs flex items-center gap-1.5">
      <span>Ver pedido</span>
      <span class="bg-white text-red-600 rounded-full w-5 h-5 flex items-center justify-center text-[11px] font-black" id="cart-total-count">0</span>
    </button>
  </footer>

  <!-- 5. 菜品定制弹窗 (中餐 / 寿司 / 饮品 智能切换) -->
  <div id="option-modal" class="hidden fixed inset-0 bg-black/60 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-4 shadow-2xl max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-start border-b pb-2.5 mb-3">
        <div>
          <h3 id="opt-dish-name" class="text-sm font-black text-gray-900 leading-tight">Plato</h3>
          <p id="opt-dish-desc" class="text-[11px] text-gray-500 mt-0.5">Descripción</p>
        </div>
        <button onclick="closeOptionModal()" class="text-gray-400 text-2xl font-bold ml-2 leading-none">&times;</button>
      </div>

      <!-- A. 便当配餐选择 (仅中餐便当有效) -->
      <div id="colacion-side-box" class="hidden mb-3">
        <label class="block text-[11px] font-bold text-gray-700 mb-1">Acompañamiento *</label>
        <div class="space-y-1.5 text-xs">
          <label class="flex items-center gap-2 p-2 rounded-lg border cursor-pointer hover:bg-gray-50">
            <input type="radio" name="side-choice" value="Con Arroz" checked data-addprice="0">
            <span>Con Arroz Chaufán / Blanco (+$0)</span>
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg border cursor-pointer hover:bg-gray-50">
            <input type="radio" name="side-choice" value="Con Papas Fritas" data-addprice="500">
            <span>Con Papas Fritas (+ $500)</span>
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg border cursor-pointer hover:bg-gray-50">
            <input type="radio" name="side-choice" value="Con Fideo Chaumín" data-addprice="800">
            <span>Con Fideo Chaumín (+ $800)</span>
          </label>
        </div>
      </div>

      <!-- B. 中餐专属定制选项 (辣度与少盐免葱) -->
      <div id="box-china-options" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">Nivel de Ají *</label>
          <div class="grid grid-cols-3 gap-1.5 text-xs">
            <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold text-[11px]">
              <input type="radio" name="opt-aji" value="Sin ají" checked class="hidden">
              <span>Sin ají</span>
            </label>
            <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold text-[11px]">
              <input type="radio" name="opt-aji" value="Con ají" class="hidden">
              <span>Con ají</span>
            </label>
            <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold text-[11px]">
              <input type="radio" name="opt-aji" value="Ají aparte" class="hidden">
              <span>Ají aparte</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">Preferencias de cocina</label>
          <div class="grid grid-cols-2 gap-1.5 text-xs">
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="pref-sal" value="Bajo en sal" class="rounded text-red-600">
              <span>Bajo en sal</span>
            </label>
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="pref-sillao" value="Poco sillao" class="rounded text-red-600">
              <span>Poco sillao</span>
            </label>
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="pref-cebollin" value="Sin cebollín" class="rounded text-red-600">
              <span>Sin cebollín</span>
            </label>
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="pref-diente" value="Sin diente" class="rounded text-red-600">
              <span>Sin diente</span>
            </label>
          </div>
        </div>
      </div>

      <!-- C. 寿司专属定制选项 (酱料、木筷、免芝士等) -->
      <div id="box-sushi-options" class="space-y-3 hidden">
        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">Salsas para sushi (选择酱料)</label>
          <div class="grid grid-cols-2 gap-1.5 text-xs">
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px] bg-gray-50">
              <input type="checkbox" id="sushi-soya" value="Salsa Soya" checked class="rounded text-red-600">
              <span>Salsa Soya (酱油)</span>
            </label>
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px] bg-gray-50">
              <input type="checkbox" id="sushi-teriyaki" value="Salsa Teriyaki" checked class="rounded text-red-600">
              <span>Salsa Teriyaki (甜酱)</span>
            </label>
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="sushi-wasabi" value="Wasabi" class="rounded text-red-600">
              <span>Wasabi (芥末)</span>
            </label>
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="sushi-jengibre" value="Jengibre" class="rounded text-red-600">
              <span>Jengibre (红姜)</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">Palitos chinos (木筷) *</label>
          <div class="grid grid-cols-2 gap-1.5 text-xs">
            <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold text-[11px]">
              <input type="radio" name="opt-palitos" value="Con palitos" checked class="hidden">
              <span>🥢 Con palitos</span>
            </label>
            <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold text-[11px]">
              <input type="radio" name="opt-palitos" value="Sin palitos" class="hidden">
              <span>🌱 Sin palitos</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">Detalles de preparación</label>
          <div class="grid grid-cols-2 gap-1.5 text-xs">
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="sushi-no-queso" value="Sin queso crema" class="rounded text-red-600">
              <span>Sin queso crema</span>
            </label>
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="sushi-no-cebollin" value="Sin cebollín" class="rounded text-red-600">
              <span>Sin cebollín</span>
            </label>
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="sushi-no-sesamo" value="Sin sésamo" class="rounded text-red-600">
              <span>Sin sésamo</span>
            </label>
            <label class="flex items-center gap-1.5 p-1.5 rounded-lg border text-[11px]">
              <input type="checkbox" id="sushi-bien-dorado" value="Bien dorado/crujiente" class="rounded text-red-600">
              <span>Bien dorado (炸脆)</span>
            </label>
          </div>
        </div>
      </div>

      <!-- D. 饮料专属选项 (冰镇 / 常温) -->
      <div id="box-drink-options" class="space-y-3 hidden">
        <div>
          <label class="block text-[11px] font-bold text-gray-700 mb-1">Temperatura deseada *</label>
          <div class="grid grid-cols-2 gap-1.5 text-xs">
            <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold text-[11px]">
              <input type="radio" name="opt-drink-temp" value="Fría / Helada" checked class="hidden">
              <span>❄️ Fría / Helada</span>
            </label>
            <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold text-[11px]">
              <input type="radio" name="opt-drink-temp" value="Al tiempo" class="hidden">
              <span>🌤️ Al tiempo</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 数量调整 -->
      <div class="flex items-center justify-between border-t pt-2.5 mt-3 mb-3">
        <span class="text-xs font-bold text-gray-700">Cantidad:</span>
        <div class="flex items-center gap-3">
          <button onclick="changeModalQty(-1)" class="w-7 h-7 rounded-full bg-gray-200 text-gray-800 font-black flex items-center justify-center">-</button>
          <span id="opt-modal-qty" class="font-bold text-sm">1</span>
          <button onclick="changeModalQty(1)" class="w-7 h-7 rounded-full bg-red-600 text-white font-black flex items-center justify-center">+</button>
        </div>
      </div>

      <button onclick="confirmAddToCart()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl shadow text-xs">
        Agregar al pedido
      </button>
    </div>
  </div>

  <!-- 6. 结账结算弹窗 (配送费已变更为 1.800 CLP) -->
  <div id="checkout-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-4 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-2.5 border-b pb-2">
        <h3 class="text-sm font-bold text-gray-900">Resumen del Pedido</h3>
        <button onclick="closeCheckoutModal()" class="text-gray-400 text-2xl font-bold leading-none">&times;</button>
      </div>

      <!-- 购物车已选商品预览 -->
      <div id="cart-items-preview" class="space-y-2 mb-3 max-h-36 overflow-y-auto divide-y text-xs"></div>

      <!-- 取餐方式：在此处选择 Para llevar 或 Delivery (+$1.800 CLP) -->
      <div class="mb-3">
        <label class="block text-[11px] font-bold text-gray-700 mb-1">Tipo de entrega *</label>
        <div class="grid grid-cols-2 gap-2 text-xs font-bold">
          <button type="button" id="btn-pickup" onclick="setOrderType('pickup')" class="py-2 rounded-lg border-2 border-red-600 bg-red-50 text-red-600 text-center">
            🛍️ Para llevar<br><span class="text-[10px] font-normal text-gray-500">(Retiro en local)</span>
          </button>
          <button type="button" id="btn-delivery" onclick="setOrderType('delivery')" class="py-2 rounded-lg border border-gray-300 text-gray-600 text-center">
            🛵 Delivery<br><span class="text-[10px] font-normal text-gray-500">(Envío +$1.800 CLP)</span>
          </button>
        </div>
      </div>

      <!-- 顾客信息填写区 -->
      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Nombre completo *</label>
          <input id="cust-name" type="text" placeholder="Ej: Lina" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-red-600">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Teléfono WhatsApp *</label>
          <input id="cust-phone" type="tel" placeholder="Ej: 56974142834" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-red-600">
        </div>
        
        <!-- 配送地址（仅当选择 Delivery 时展开） -->
        <div id="address-box" class="hidden">
          <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Dirección de entrega *</label>
          <input id="cust-address" type="text" placeholder="Calle, número, departamento / Comuna" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-red-600">
        </div>

        <div>
          <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Método de pago *</label>
          <select id="pay-method" onchange="toggleCashInput()" class="w-full border rounded-lg p-2 text-xs bg-white outline-none focus:border-red-600">
            <option value="efectivo">Efectivo al recibir (现金)</option>
            <option value="tarjeta">Tarjeta Débito / Crédito POS (现场刷卡)</option>
            <option value="transferencia">Transferencia Bancaria (银行转账)</option>
          </select>
        </div>

        <div id="cash-amount-box">
          <label class="block text-[10px] font-bold text-gray-600 mb-0.5">¿Con cuánto efectivo pagarás? (找零)</label>
          <input id="cust-cash" type="number" placeholder="Ej: 20000" class="w-full border rounded-lg p-2 text-xs outline-none focus:border-red-600">
        </div>

        <div>
          <label class="block text-[10px] font-bold text-gray-600 mb-0.5">Comentarios adicionales</label>
          <input id="cust-notes" type="text" placeholder="Ej: Servilletas extras, llamar al llegar..." class="w-full border rounded-lg p-2 text-xs outline-none focus:border-red-600">
        </div>
      </div>

      <!-- 结账汇总金额与跳转发送按钮 -->
      <div class="mt-3.5 border-t pt-2.5">
        <div class="flex justify-between text-xs font-bold text-gray-700 mb-2">
          <span>Total a pagar:</span>
          <span class="text-red-600 text-sm font-black">$ <span id="modal-checkout-total">0</span> CLP</span>
        </div>
        <button onclick="sendOrderToWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 active:scale-95 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-1.5 shadow text-xs">
          <span>Enviar pedido a WhatsApp</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const MY_WHATSAPP_NUMBER = "56974142810";
    const SUPABASE_URL = "https://ecjxlhhhywxsqtwbujxr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjanhsaGhoeXd4c3F0d2J1anhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTE0NDgsImV4cCI6MjEwNzI2NzQ0OH0.7_OdMxyrL-rAZH8Kh3Uz8M_pgA_EfwiAzPqnfXUTiLs";
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    // 中餐分类体系（包含饮品）
    const categoriesChina = [
      { id: "cat-menus", title: "🍱 MENÚS COMBINADOS", icon: "🍱", short: "Menús" },
      { id: "cat-colaciones", title: "🍛 COLACIONES", icon: "🍛", short: "Colaciones" },
      { id: "cat-aperitivos", title: "🥟 APERITIVOS", icon: "🥟", short: "Aperitivos" },
      { id: "cat-vacuno", title: "🥩 VACUNO", icon: "🥩", short: "Vacuno" },
      { id: "cat-pollo", title: "🍗 POLLO", icon: "🍗", short: "Pollo" },
      { id: "cat-cerdo", title: "🐷 CERDO", icon: "🐷", short: "Cerdo" },
      { id: "cat-chaumin", title: "🍜 CHAUMÍN", icon: "🍜", short: "Chaumín" },
      { id: "cat-arroz", title: "🍚 ARROZ", icon: "🍚", short: "Arroz" },
      { id: "cat-sopas", title: "🍲 SOPAS", icon: "🍲", short: "Sopas" },
      { id: "cat-chapsui", title: "🥗 CHAPSUI", icon: "🥗", short: "Chapsui" },
      { id: "cat-dragon", title: "🌱 DIENTE DRAGÓN", icon: "🌱", short: "Diente Dragón" },
      { id: "cat-mariscos", title: "🍤 MARISCOS", icon: "🍤", short: "Mariscos" },
      { id: "cat-parrilladas", title: "🥘 PARRILLADAS", icon: "🥘", short: "Parrilladas" },
      { id: "cat-bebidas", title: "🥤 BEBIDAS Y JUGOS", icon: "🥤", short: "Bebidas" }
    ];

    // 寿司分类体系（包含饮品）
    const categoriesSushi = [
      { id: "cat-sushi-promos", title: "🍱 PROMOS SUSHI", icon: "🍱", short: "Promos" },
      { id: "cat-sushi-hot", title: "🔥 HOT ROLLS (Fritos)", icon: "🔥", short: "Hot Rolls" },
      { id: "cat-sushi-california", title: "🥑 CALIFORNIA ROLLS", icon: "🥑", short: "California" },
      { id: "cat-sushi-envueltos", title: "🍣 ENVUELTOS", icon: "🍣", short: "Envueltos" },
      { id: "cat-sushi-handrolls", title: "🌯 HAND ROLLS", icon: "🌯", short: "Hand Rolls" },
      { id: "cat-sushi-gohan", title: "🍚 GOHAN BOWLS", icon: "🍚", short: "Gohan" },
      { id: "cat-bebidas", title: "🥤 BEBIDAS Y JUGOS", icon: "🥤", short: "Bebidas" }
    ];

    let currentMenuMode = 'china';
    let allDishes = [];
    let cart = [];
    let currentSelectedDish = null;
    let modalQty = 1;
    let orderType = 'pickup';

    function switchMainMenu(mode) {
      currentMenuMode = mode;
      const btnChina = document.getElementById('btn-tab-china');
      const btnSushi = document.getElementById('btn-tab-sushi');

      if (mode === 'china') {
        btnChina.className = "flex-1 py-1.5 rounded-xl text-xs font-black border-2 border-red-600 bg-red-50 text-red-700 flex items-center justify-center gap-1 shadow-sm transition";
        btnSushi.className = "flex-1 py-1.5 rounded-xl text-xs font-bold border border-gray-200 bg-gray-50 text-gray-600 flex items-center justify-center gap-1 transition";
      } else {
        btnSushi.className = "flex-1 py-1.5 rounded-xl text-xs font-black border-2 border-red-600 bg-red-50 text-red-700 flex items-center justify-center gap-1 shadow-sm transition";
        btnChina.className = "flex-1 py-1.5 rounded-xl text-xs font-bold border border-gray-200 bg-gray-50 text-gray-600 flex items-center justify-center gap-1 transition";
      }
      renderCurrentMenu();
    }

    async function loadLiveMenu() {
      const container = document.getElementById('menu-container');
      const { data, error } = await db.from('dishes').select('*').order('id', { ascending: true });

      if (error) {
        container.innerHTML = '<div class="text-center py-20 text-red-500 text-xs">Error de conexión: ' + error.message + '</div>';
        return;
      }

      allDishes = data || [];
      renderCurrentMenu();
    }

    function renderCurrentMenu() {
      const activeCats = currentMenuMode === 'china' ? categoriesChina : categoriesSushi;
      renderSidebar(activeCats);
      renderDishesList(activeCats);
    }

    function renderSidebar(cats) {
      const sidebar = document.getElementById('sidebar-categories');
      let html = '';
      cats.forEach((cat, idx) => {
        const isFirst = idx === 0;
        const activeClass = isFirst ? 'bg-white text-red-600 font-black border-l-4 border-red-600 shadow-sm' : 'text-gray-500 font-semibold hover:bg-gray-100';
        html += '<button id="side-btn-' + cat.id + '" onclick="scrollToSection(\'' + cat.id + '\')" class="w-full text-left px-2.5 py-3 text-[11px] transition flex flex-col items-center text-center gap-1 border-b border-gray-100 ' + activeClass + '">';
        html += '  <span class="text-base leading-none">' + cat.icon + '</span>';
        html += '  <span class="leading-tight break-words">' + cat.short + '</span>';
        html += '</button>';
      });
      sidebar.innerHTML = html;
    }

    function renderDishesList(cats) {
      const container = document.getElementById('menu-container');
      let html = '';

      cats.forEach(cat => {
        const items = allDishes.filter(d => d.category === cat.id);
        if (items.length === 0) return;

        html += '<section id="' + cat.id + '" class="scroll-mt-2">';
        html += '<h2 class="text-xs font-black text-gray-700 bg-gray-200/80 py-1.5 px-2.5 rounded-lg mb-2 uppercase tracking-wide flex items-center gap-1">' + cat.icon + ' ' + cat.title + '</h2>';
        html += '<div class="space-y-2">';

        items.forEach(dish => {
          const isSoldOut = !dish.is_available;
          const clickAttr = isSoldOut ? '' : 'onclick="openOptionModal(' + dish.id + ')"';
          const cardStyle = isSoldOut 
            ? 'bg-white p-2.5 rounded-xl border border-gray-100 flex justify-between items-center opacity-50 bg-gray-50 cursor-not-allowed' 
            : 'bg-white p-2.5 rounded-xl border border-gray-100 flex justify-between items-center active:scale-[0.99] transition cursor-pointer shadow-sm';
          const badge = isSoldOut ? '<span class="bg-red-600 text-white text-[8px] px-1 py-0.2 rounded font-black">AGOTADO</span>' : '';
          const btnBg = isSoldOut ? 'bg-gray-300 text-gray-500' : 'bg-red-600 text-white';
          const btnIcon = isSoldOut ? '✕' : '+';
          const descText = dish.description || '';
          const priceStr = Number(dish.price).toLocaleString('es-CL');

          html += '<div ' + clickAttr + ' class="' + cardStyle + '">';
          html += '  <div class="flex-1 pr-2">';
          html += '    <div class="flex items-center gap-1.5">';
          html += '      <h3 class="font-bold text-xs text-gray-900 leading-snug">' + dish.name + '</h3>';
          html +=        badge;
          html += '    </div>';
          if (descText) {
            html += '    <p class="text-[10px] text-gray-400 mt-0.5 line-clamp-2 leading-tight">' + descText + '</p>';
          }
          html += '    <div class="text-xs font-black text-red-600 mt-1">$ ' + priceStr + ' CLP</div>';
          html += '  </div>';
          html += '  <button class="w-7 h-7 rounded-full ' + btnBg + ' font-black text-sm flex items-center justify-center shrink-0 shadow-sm">' + btnIcon + '</button>';
          html += '</div>';
        });

        html += '</div></section>';
      });

      if (!html) {
        html = '<div class="text-center py-20 text-gray-400 text-xs">No hay platos disponibles en esta sección por el momento.</div>';
      }

      container.innerHTML = html;
    }

    function scrollToSection(catId) {
      const el = document.getElementById(catId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.querySelectorAll('#sidebar-categories button').forEach(btn => {
          btn.className = "w-full text-left px-2.5 py-3 text-[11px] transition flex flex-col items-center text-center gap-1 border-b border-gray-100 text-gray-500 font-semibold hover:bg-gray-100";
        });
        const activeBtn = document.getElementById('side-btn-' + catId);
        if (activeBtn) {
          activeBtn.className = "w-full text-left px-2.5 py-3 text-[11px] transition flex flex-col items-center text-center gap-1 border-b border-gray-100 bg-white text-red-600 font-black border-l-4 border-red-600 shadow-sm";
        }
      }
    }

    // 打开定制弹窗（核心分支：区分中餐、寿司、饮料）
    function openOptionModal(dishId) {
      currentSelectedDish = allDishes.find(i => i.id === dishId);
      if (!currentSelectedDish || !currentSelectedDish.is_available) return;

      modalQty = 1;
      document.getElementById('opt-modal-qty').innerText = modalQty;
      document.getElementById('opt-dish-name').innerText = currentSelectedDish.name;
      document.getElementById('opt-dish-desc').innerText = currentSelectedDish.description || '';

      const isSushi = currentSelectedDish.category.startsWith('cat-sushi-');
      const isDrink = currentSelectedDish.category === 'cat-bebidas';
      const isColacion = currentSelectedDish.is_colacion;

      // 控制不同分类的界面展示
      document.getElementById('colacion-side-box').classList.toggle('hidden', !isColacion);
      document.getElementById('box-china-options').classList.toggle('hidden', isSushi || isDrink);
      document.getElementById('box-sushi-options').classList.toggle('hidden', !isSushi);
      document.getElementById('box-drink-options').classList.toggle('hidden', !isDrink);

      // 重置各个模块的默认值
      if (isSushi) {
        document.getElementById('sushi-soya').checked = true;
        document.getElementById('sushi-teriyaki').checked = true;
        document.getElementById('sushi-wasabi').checked = false;
        document.getElementById('sushi-jengibre').checked = false;
        document.querySelector('input[name="opt-palitos"][value="Con palitos"]').checked = true;
        document.getElementById('sushi-no-queso').checked = false;
        document.getElementById('sushi-no-cebollin').checked = false;
        document.getElementById('sushi-no-sesamo').checked = false;
        document.getElementById('sushi-bien-dorado').checked = false;
      } else if (isDrink) {
        document.querySelector('input[name="opt-drink-temp"][value="Fría / Helada"]').checked = true;
      } else {
        document.querySelector('input[name="opt-aji"][value="Sin ají"]').checked = true;
        document.getElementById('pref-sal').checked = false;
        document.getElementById('pref-sillao').checked = false;
        document.getElementById('pref-cebollin').checked = false;
        document.getElementById('pref-diente').checked = false;
      }

      document.getElementById('option-modal').classList.remove('hidden');
    }

    function closeOptionModal() {
      document.getElementById('option-modal').classList.add('hidden');
    }

    function changeModalQty(delta) {
      modalQty = Math.max(1, modalQty + delta);
      document.getElementById('opt-modal-qty').innerText = modalQty;
    }

    function confirmAddToCart() {
      if (!currentSelectedDish) return;

      let extraPrice = 0;
      let optionsList = [];

      // 1. 便当加价选项
      if (currentSelectedDish.is_colacion) {
        const selectedSide = document.querySelector('input[name="side-choice"]:checked');
        if (selectedSide) {
          optionsList.push(selectedSide.value);
          extraPrice += parseInt(selectedSide.dataset.addprice || 0);
        }
      }

      const isSushi = currentSelectedDish.category.startsWith('cat-sushi-');
      const isDrink = currentSelectedDish.category === 'cat-bebidas';

      // 2. 根据类型收录专属选项
      if (isSushi) {
        let salsas = [];
        if (document.getElementById('sushi-soya').checked) salsas.push('Soya');
        if (document.getElementById('sushi-teriyaki').checked) salsas.push('Teriyaki');
        if (document.getElementById('sushi-wasabi').checked) salsas.push('Wasabi');
        if (document.getElementById('sushi-jengibre').checked) salsas.push('Jengibre');
        if (salsas.length > 0) optionsList.push('Salsas: ' + salsas.join(', '));

        const palitosChoice = document.querySelector('input[name="opt-palitos"]:checked').value;
        optionsList.push(palitosChoice);

        if (document.getElementById('sushi-no-queso').checked) optionsList.push('Sin queso crema');
        if (document.getElementById('sushi-no-cebollin').checked) optionsList.push('Sin cebollín');
        if (document.getElementById('sushi-no-sesamo').checked) optionsList.push('Sin sésamo');
        if (document.getElementById('sushi-bien-dorado').checked) optionsList.push('Bien dorado');
      } else if (isDrink) {
        const tempChoice = document.querySelector('input[name="opt-drink-temp"]:checked').value;
        optionsList.push(tempChoice);
      } else {
        const ajiChoice = document.querySelector('input[name="opt-aji"]:checked').value;
        if (ajiChoice !== 'Sin ají') optionsList.push(ajiChoice);

        if (document.getElementById('pref-sal').checked) optionsList.push('Bajo en sal');
        if (document.getElementById('pref-sillao').checked) optionsList.push('Poco sillao');
        if (document.getElementById('pref-cebollin').checked) optionsList.push('Sin cebollín');
        if (document.getElementById('pref-diente').checked) optionsList.push('Sin diente');
      }

      const finalUnitPrice = currentSelectedDish.price + extraPrice;

      cart.push({
        dishId: currentSelectedDish.id,
        name: currentSelectedDish.name,
        unitPrice: finalUnitPrice,
        qty: modalQty,
        options: optionsList
      });

      closeOptionModal();
      updateCartUI();
    }

    function updateCartUI() {
      let totalQty = 0;
      let totalPrice = 0;
      cart.forEach(item => {
        totalQty += item.qty;
        totalPrice += item.unitPrice * item.qty;
      });
      document.getElementById('cart-total-count').innerText = totalQty;
      document.getElementById('cart-total-price').innerText = totalPrice.toLocaleString('es-CL');
    }

    // 履约方式切换（配送费严格设定为 1800 CLP）
    function setOrderType(type) {
      orderType = type;
      const btnPick = document.getElementById('btn-pickup');
      const btnDel = document.getElementById('btn-delivery');
      const addrBox = document.getElementById('address-box');

      if (type === 'pickup') {
        btnPick.className = "py-2 rounded-lg border-2 border-red-600 bg-red-50 text-red-600 text-center";
        btnDel.className = "py-2 rounded-lg border border-gray-300 text-gray-600 text-center";
        addrBox.classList.add('hidden');
      } else {
        btnDel.className = "py-2 rounded-lg border-2 border-red-600 bg-red-50 text-red-600 text-center";
        btnPick.className = "py-2 rounded-lg border border-gray-300 text-gray-600 text-center";
        addrBox.classList.remove('hidden');
      }
      refreshCheckoutTotal();
    }

    function toggleCashInput() {
      const method = document.getElementById('pay-method').value;
      const cashBox = document.getElementById('cash-amount-box');
      if (method === 'efectivo') cashBox.classList.remove('hidden');
      else cashBox.classList.add('hidden');
    }

    // 总结算金额（含配送费 1800 CLP）
    function refreshCheckoutTotal() {
      let subtotal = 0;
      cart.forEach(item => {
        subtotal += item.unitPrice * item.qty;
      });
      const deliveryFee = (orderType === 'delivery') ? 1800 : 0;
      const grandTotal = subtotal + deliveryFee;
      document.getElementById('modal-checkout-total').innerText = grandTotal.toLocaleString('es-CL');
    }

    function openCheckoutModal() {
      if (cart.length === 0) {
        alert("El carrito está vacío. Agrega platos antes de continuar.");
        return;
      }
      const container = document.getElementById('cart-items-preview');
      let previewHtml = '';
      cart.forEach((item, index) => {
        const itemTotal = (item.unitPrice * item.qty).toLocaleString('es-CL');
        const optText = item.options.length > 0 ? '<div class="text-[10px] text-gray-400 leading-tight mt-0.5">• ' + item.options.join(', ') + '</div>' : '';
        previewHtml += '<div class="py-1.5 flex justify-between items-start">';
        previewHtml += '  <div class="flex-1 pr-2">';
        previewHtml += '    <div class="font-bold text-gray-800 text-xs">' + item.qty + 'x ' + item.name + '</div>';
        previewHtml +=      optText;
        previewHtml += '    <div class="text-red-600 font-bold mt-0.5 text-xs">$ ' + itemTotal + ' CLP</div>';
        previewHtml += '  </div>';
        previewHtml += '  <button onclick="removeFromCart(' + index + ')" class="text-red-500 text-[11px] px-1.5 py-0.5 font-bold">Quitar</button>';
        previewHtml += '</div>';
      });
      container.innerHTML = previewHtml;
      refreshCheckoutTotal();
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
      if (cart.length === 0) closeCheckoutModal();
      else openCheckoutModal();
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function getChileDateTime() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return { date: dd + '/' + mm + '/' + yyyy, time: hh + ':' + min };
    }

    // 生成发往 WhatsApp 的订单长文本
    function sendOrderToWhatsApp() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const method = document.getElementById('pay-method').value;
      const cashGiven = parseFloat(document.getElementById('cust-cash').value) || 0;
      const notes = document.getElementById('cust-notes').value.trim();

      if (!name || !phone) {
        alert("Por favor completa tu nombre y teléfono.");
        return;
      }
      if (orderType === 'delivery' && !address) {
        alert("Por favor ingresa tu dirección para el envío.");
        return;
      }

      const orderCode = 'CL-' + Math.floor(1000000000 + Math.random() * 9000000000);
      const dt = getChileDateTime();

      let subtotal = 0;
      let productsList = [];
      cart.forEach(item => {
        const itemTotal = item.unitPrice * item.qty;
        subtotal += itemTotal;
        let line = 'X' + item.qty + ' ' + item.name + ' $ ' + itemTotal.toLocaleString('es-CL');
        if (item.options.length > 0) line += '\n   • ' + item.options.join(', ');
        productsList.push(line);
      });

      // 配送费设为 1800 CLP
      const deliveryFee = (orderType === 'delivery') ? 1800 : 0;
      const total = subtotal + deliveryFee;

      let payDetail = "";
      if (method === 'efectivo') {
        if (cashGiven > total) {
          const vuelto = cashGiven - total;
          payDetail = 'Efectivo ' + total.toLocaleString('es-CL') + ' (monto recibido ' + cashGiven.toLocaleString('es-CL') + ', vuelto ' + vuelto.toLocaleString('es-CL') + ')';
        } else {
          payDetail = 'Efectivo exacto $ ' + total.toLocaleString('es-CL');
        }
      } else if (method === 'tarjeta') {
        payDetail = 'Tarjeta Débito/Crédito al recibir (POS)';
      } else {
        payDetail = 'Transferencia Bancaria';
      }

      const serviceType = orderType === 'pickup' ? 'Para llevar (Retiro en local)' : 'Delivery (Envío a domicilio)';
      const addressLine = orderType === 'delivery' ? '\nDirección: ' + address : '';

      const message = orderCode + '\n' +
        '📅 ' + dt.date + ' ⏰ ' + dt.time + '\n\n' +
        'Tipo de servicio: ' + serviceType + '\n\n' +
        'Nombre: ' + name + '\n' +
        'Teléfono: ' + phone + addressLine + '\n\n' +
        '📝 Productos\n' +
        productsList.join('\n') + '\n\n' +
        'Subtotal: $ ' + subtotal.toLocaleString('es-CL') + '\n' +
        'Entrega: $ ' + deliveryFee.toLocaleString('es-CL') + '\n' +
        'Total: $ ' + total.toLocaleString('es-CL') + '\n\n' +
        '💲 Pago\n' +
        'Estado del pago: No pagado\n' +
        'Total a pagar: $ ' + total.toLocaleString('es-CL') + '\n' +
        payDetail + '\n\n' +
        'Comentarios adicionales:\n' +
        (notes ? notes : 'Sin comentarios');

      window.location.href = 'https://wa.me/' + MY_WHATSAPP_NUMBER + '?text=' + encodeURIComponent(message);
    }

    loadLiveMenu();
  </script>
