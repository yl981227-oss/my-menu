<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Online - Comida China</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-28">

  <header class="bg-red-700 text-white p-4 shadow-md sticky top-0 z-20">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-xl font-black tracking-wide">🍜 RESTAURANT CHINO</h1>
        <p class="text-xs text-red-200 mt-0.5">Pedidos por WhatsApp • Delivery & Retiro</p>
      </div>
      <span class="bg-red-800 text-xs px-2.5 py-1 rounded-full text-red-100 font-semibold border border-red-600">Abierto</span>
    </div>

    <nav class="flex gap-2 overflow-x-auto no-scrollbar pt-3 -mx-4 px-4 text-xs font-semibold whitespace-nowrap">
      <button onclick="scrollToCat('cat-menus')" class="bg-white text-red-700 px-3 py-1.5 rounded-full shadow-sm">🍱 Menús</button>
      <button onclick="scrollToCat('cat-colaciones')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🍛 Colaciones</button>
      <button onclick="scrollToCat('cat-aperitivos')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🥟 Aperitivos</button>
      <button onclick="scrollToCat('cat-vacuno')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🥩 Vacuno</button>
      <button onclick="scrollToCat('cat-pollo')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🍗 Pollo</button>
      <button onclick="scrollToCat('cat-cerdo')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🐷 Cerdo</button>
      <button onclick="scrollToCat('cat-chaumin')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🍜 Chaumín</button>
      <button onclick="scrollToCat('cat-arroz')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🍚 Arroz</button>
      <button onclick="scrollToCat('cat-sopas')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🍲 Sopas</button>
      <button onclick="scrollToCat('cat-chapsui')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🥗 Chapsui</button>
      <button onclick="scrollToCat('cat-dragon')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🌱 Diente Dragón</button>
      <button onclick="scrollToCat('cat-mariscos')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🍤 Mariscos</button>
      <button onclick="scrollToCat('cat-parrilladas')" class="bg-red-800 text-white px-3 py-1.5 rounded-full">🥘 Parrilladas</button>
    </nav>
  </header>

  <section class="p-3 bg-white mb-3 shadow-sm">
    <div class="grid grid-cols-2 gap-2 text-xs font-bold">
      <button id="btn-pickup" onclick="setOrderType('pickup')" class="py-2.5 rounded-lg border-2 border-red-600 bg-red-50 text-red-600">
        🛍️ Para llevar (Retiro)
      </button>
      <button id="btn-delivery" onclick="setOrderType('delivery')" class="py-2.5 rounded-lg border border-gray-300 text-gray-600">
        🛵 Delivery (Envío)
      </button>
    </div>
  </section>

  <main id="menu-container" class="px-3 space-y-6">
    <div class="text-center py-16 text-gray-400 text-xs">Cargando menú actualizado...</div>
  </main>

  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex items-center justify-between shadow-2xl z-30">
    <div>
      <div class="text-[11px] text-gray-500">Total pedido:</div>
      <div class="text-lg font-black text-red-600">$ <span id="cart-total-price">0</span> CLP</div>
    </div>
    <button onclick="openCheckoutModal()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-5 rounded-full shadow-md text-sm">
      Ver pedido (<span id="cart-total-count">0</span>)
    </button>
  </footer>

  <div id="option-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-start border-b pb-3 mb-3">
        <div>
          <h3 id="opt-dish-name" class="text-base font-black text-gray-900 leading-tight">菜品名称</h3>
          <p id="opt-dish-desc" class="text-xs text-gray-500 mt-1">菜品简介</p>
        </div>
        <button onclick="closeOptionModal()" class="text-gray-400 text-2xl font-bold ml-2">&times;</button>
      </div>

      <div id="colacion-side-box" class="hidden mb-4">
        <label class="block text-xs font-bold text-gray-700 mb-1.5">Acompañamiento (配餐选择) *</label>
        <div class="space-y-1.5 text-xs">
          <label class="flex items-center gap-2 p-2 rounded-lg border cursor-pointer hover:bg-gray-50">
            <input type="radio" name="side-choice" value="Con Arroz" checked data-addprice="0">
            <span>Con Arroz Chaufán / Blanco (+$0)</span>
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg border cursor-pointer hover:bg-gray-50">
            <input type="radio" name="side-choice" value="Con Papas Fritas" data-addprice="500">
            <span>Con Papas Fritas (+ $500)</span>
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg border cursor-pointer hover:bg-gray-50">
            <input type="radio" name="side-choice" value="Con Fideo Chaumín" data-addprice="800">
            <span>Con Fideo Chaumín (+ $800)</span>
          </label>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-700 mb-1.5">Nivel de Ají (辣度) *</label>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold">
            <input type="radio" name="opt-aji" value="Sin ají" checked class="hidden">
            <span>Sin ají (不辣)</span>
          </label>
          <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold">
            <input type="radio" name="opt-aji" value="Con ají" class="hidden">
            <span>Con ají (加辣)</span>
          </label>
          <label class="flex items-center justify-center p-2 rounded-lg border text-center cursor-pointer has-[:checked]:border-red-600 has-[:checked]:bg-red-50 has-[:checked]:text-red-600 font-semibold">
            <input type="radio" name="opt-aji" value="Ají aparte" class="hidden">
            <span>Ají aparte (另包)</span>
          </label>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-700 mb-1.5">Preferencias de cocina (口味要求)</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center gap-1.5 p-2 rounded-lg border">
            <input type="checkbox" id="pref-sal" value="Bajo en sal" class="rounded text-red-600">
            <span>Bajo en sal (少盐)</span>
          </label>
          <label class="flex items-center gap-1.5 p-2 rounded-lg border">
            <input type="checkbox" id="pref-sillao" value="Poco sillao" class="rounded text-red-600">
            <span>Poco sillao (少酱油)</span>
          </label>
          <label class="flex items-center gap-1.5 p-2 rounded-lg border">
            <input type="checkbox" id="pref-cebollin" value="Sin cebollín" class="rounded text-red-600">
            <span>Sin cebollín (免葱)</span>
          </label>
          <label class="flex items-center gap-1.5 p-2 rounded-lg border">
            <input type="checkbox" id="pref-diente" value="Sin diente de dragón" class="rounded text-red-600">
            <span>Sin diente dragón</span>
          </label>
        </div>
      </div>

      <div class="flex items-center justify-between border-t pt-3 mb-4">
        <span class="text-xs font-bold text-gray-700">Cantidad:</span>
        <div class="flex items-center gap-3">
          <button onclick="changeModalQty(-1)" class="w-8 h-8 rounded-full bg-gray-200 text-gray-800 font-black flex items-center justify-center">-</button>
          <span id="opt-modal-qty" class="font-bold text-sm">1</span>
          <button onclick="changeModalQty(1)" class="w-8 h-8 rounded-full bg-red-600 text-white font-black flex items-center justify-center">+</button>
        </div>
      </div>

      <button onclick="confirmAddToCart()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow text-sm">
        Agregar al pedido
      </button>
    </div>
  </div>

  <div id="checkout-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3 border-b pb-2">
        <h3 class="text-base font-bold">Resumen del Pedido</h3>
        <button onclick="closeCheckoutModal()" class="text-gray-400 text-2xl font-bold">&times;</button>
      </div>

      <div id="cart-items-preview" class="space-y-2 mb-4 max-h-40 overflow-y-auto divide-y text-xs"></div>

      <div class="space-y-2.5">
        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Nombre completo *</label>
          <input id="cust-name" type="text" placeholder="Ej: Lina" class="w-full border rounded-lg p-2 text-xs">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Teléfono WhatsApp *</label>
          <input id="cust-phone" type="tel" placeholder="Ej: 56974142834" class="w-full border rounded-lg p-2 text-xs">
        </div>
        <div id="address-box" class="hidden">
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Dirección exacta de entrega *</label>
          <input id="cust-address" type="text" placeholder="Calle, número, depto / comuna" class="w-full border rounded-lg p-2 text-xs">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Método de pago *</label>
          <select id="pay-method" onchange="toggleCashInput()" class="w-full border rounded-lg p-2 text-xs bg-white">
            <option value="efectivo">Efectivo al recibir (现金)</option>
            <option value="tarjeta">Tarjeta Débito / Crédito POS (现场刷卡)</option>
            <option value="transferencia">Transferencia Bancaria (银行转账)</option>
          </select>
        </div>

        <div id="cash-amount-box">
          <label class="block text-[11px] font-bold text-gray-600 mb-1">¿Con cuánto efectivo pagarás? (找零计算)</label>
          <input id="cust-cash" type="number" placeholder="Ej: 20000 (deja vacío si es justo)" class="w-full border rounded-lg p-2 text-xs">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-gray-600 mb-1">Comentarios adicionales generales</label>
          <input id="cust-notes" type="text" placeholder="Ej: Servilletas extras, llamar al llegar..." class="w-full border rounded-lg p-2 text-xs">
        </div>
      </div>

      <div class="mt-4">
        <button onclick="sendOrderToWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 shadow text-sm">
          <span>Enviar pedido a WhatsApp</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const MY_WHATSAPP_NUMBER = "56974142810";
    const SUPABASE_URL = "https://ecjxlhhhywxsqtwbujxr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjanhsaGhoeXd4c3F0d2J1anhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTE0NDgsImV4cCI6MjEwNzI2NzQ0OH0.7_OdMxyrL-rAZH8Kh3Uz8M_pgA_EfwiAzPqnfXUTiLs";
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const categoriesDef = [
      { id: "cat-menus", title: "🍱 MENÚS COMBINADOS" },
      { id: "cat-colaciones", title: "🍛 COLACIONES" },
      { id: "cat-aperitivos", title: "🥟 EL APERITIVO" },
      { id: "cat-vacuno", title: "🥩 VACUNO" },
      { id: "cat-pollo", title: "🍗 POLLO" },
      { id: "cat-cerdo", title: "🐷 CERDO" },
      { id: "cat-chaumin", title: "🍜 CHAUMÍN" },
      { id: "cat-arroz", title: "🍚 ARROZ" },
      { id: "cat-sopas", title: "🍲 SOPAS" },
      { id: "cat-chapsui", title: "🥗 CHAPSUI" },
      { id: "cat-dragon", title: "🌱 DIENTE DE DRAGÓN" },
      { id: "cat-mariscos", title: "🍤 PESCADOS Y MARISCOS" },
      { id: "cat-parrilladas", title: "🥘 PARRILLADAS" }
    ];

    let allDishes = [];
    let cart = [];
    let currentSelectedDish = null;
    let modalQty = 1;
    let orderType = 'pickup';

    async function loadLiveMenu() {
      const container = document.getElementById('menu-container');
      const { data, error } = await db.from('dishes').select('*').order('id', { ascending: true });

      if (error) {
        container.innerHTML = `<div class="text-center py-16 text-red-500 text-xs">Error de conexión: ${error.message}</div>`;
        return;
      }

      allDishes = data;
      renderLiveMenu();
    }

    function renderLiveMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = categoriesDef.map(cat => {
        const items = allDishes.filter(d => d.category === cat.id);
        if (items.length === 0) return '';

        return `
          <section id="${cat.id}">
            <h2 class="text-sm font-black text-gray-800 bg-gray-200 py-1.5 px-3 rounded-lg mb-2.5 uppercase tracking-wide">
              ${cat.title}
            </h2>
            <div class="space-y-2.5">
              ${items.map(dish => {
                const isSoldOut = !dish.is_available;
                return `
                  <div onclick="${isSoldOut ? '' : `openOptionModal(${dish.id})`}" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center ${isSoldOut ? 'opacity-60 cursor-not-allowed bg-gray-50' : 'active:bg-gray-50 cursor-pointer'}">
                    <div class="flex-1 pr-3">
                      <div class="flex items-center gap-2">
                        <h3 class="font-bold text-xs text-gray-900">${dish.name}</h3>${isSoldOut ? '<span class="bg-red-600 text-white text-[9px] px-1.5 py-0.5 rounded font-black tracking-wide">AGOTADO</span>' : ''}
                      </div>
                      <p class="text-[11px] text-gray-500 mt-0.5 line-clamp-2">${dish.description \vert{}\vert{} ''}</p>                       <div class="text-xs font-black text-red-600 mt-1">$ ${dish.price.toLocaleString('es-CL')} CLP</div>
                    </div>
                    <button class="w-8 h-8 rounded-full ${isSoldOut ? 'bg-gray-300 text-gray-500' : 'bg-red-600 text-white'} font-black text-base flex items-center justify-center shadow-sm shrink-0">
                      ${isSoldOut ? '✕' : '+'}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    function scrollToCat(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function openOptionModal(dishId) {
      currentSelectedDish = allDishes.find(i => i.id === dishId);
      if (!currentSelectedDish || !currentSelectedDish.is_available) return;

      modalQty = 1;
      document.getElementById('opt-modal-qty').innerText = modalQty;
      document.getElementById('opt-dish-name').innerText = currentSelectedDish.name;
      document.getElementById('opt-dish-desc').innerText = currentSelectedDish.description || '';

      const sideBox = document.getElementById('colacion-side-box');
      if (currentSelectedDish.is_colacion) {
        sideBox.classList.remove('hidden');
      } else {
        sideBox.classList.add('hidden');
      }

      document.querySelector('input[name="opt-aji"][value="Sin ají"]').checked = true;
      document.getElementById('pref-sal').checked = false;
      document.getElementById('pref-sillao').checked = false;
      document.getElementById('pref-cebollin').checked = false;
      document.getElementById('pref-diente').checked = false;

      document.getElementById('option-modal').classList.remove('hidden');
    }

    function closeOptionModal() {
      document.getElementById('option-modal').classList.add('hidden');
    }

    function changeModalQty(delta) {
      modalQty = Math.max(1, modalQty + delta);
      document.getElementById('opt-modal-qty').innerText = modalQty;
    }

    function confirmAddToCart() {
      if (!currentSelectedDish) return;

      let extraPrice = 0;
      let optionsList = [];

      if (currentSelectedDish.is_colacion) {
        const selectedSide = document.querySelector('input[name="side-choice"]:checked');
        if (selectedSide) {
          optionsList.push(selectedSide.value);
          extraPrice += parseInt(selectedSide.dataset.addprice || 0);
        }
      }

      const ajiChoice = document.querySelector('input[name="opt-aji"]:checked').value;
      if (ajiChoice !== 'Sin ají') optionsList.push(ajiChoice);

      if (document.getElementById('pref-sal').checked) optionsList.push('Bajo en sal');
      if (document.getElementById('pref-sillao').checked) optionsList.push('Poco sillao');
      if (document.getElementById('pref-cebollin').checked) optionsList.push('Sin cebollín');
      if (document.getElementById('pref-diente').checked) optionsList.push('Sin diente');

      const finalUnitPrice = currentSelectedDish.price + extraPrice;

      cart.push({
        dishId: currentSelectedDish.id,
        name: currentSelectedDish.name,
        unitPrice: finalUnitPrice,
        qty: modalQty,
        options: optionsList
      });

      closeOptionModal();
      updateCartUI();
    }

    function updateCartUI() {
      let totalQty = 0;
      let totalPrice = 0;
      cart.forEach(item => {
        totalQty += item.qty;
        totalPrice += item.unitPrice * item.qty;
      });
      document.getElementById('cart-total-count').innerText = totalQty;
      document.getElementById('cart-total-price').innerText = totalPrice.toLocaleString('es-CL');
    }

    function setOrderType(type) {
      orderType = type;
      const btnPick = document.getElementById('btn-pickup');
      const btnDel = document.getElementById('btn-delivery');
      const addrBox = document.getElementById('address-box');

      if (type === 'pickup') {
        btnPick.className = "py-2.5 rounded-lg border-2 border-red-600 bg-red-50 text-red-600";
        btnDel.className = "py-2.5 rounded-lg border border-gray-300 text-gray-600";
        addrBox.classList.add('hidden');
      } else {
        btnDel.className = "py-2.5 rounded-lg border-2 border-red-600 bg-red-50 text-red-600";
        btnPick.className = "py-2.5 rounded-lg border border-gray-300 text-gray-600";
        addrBox.classList.remove('hidden');
      }
    }

    function toggleCashInput() {
      const method = document.getElementById('pay-method').value;
      const cashBox = document.getElementById('cash-amount-box');
      if (method === 'efectivo') cashBox.classList.remove('hidden');
      else cashBox.classList.add('hidden');
    }

    function openCheckoutModal() {
      if (cart.length === 0) {
        alert("El carrito está vacío.");
        return;
      }
      const container = document.getElementById('cart-items-preview');
      container.innerHTML = cart.map((item, index) => `
        <div class="py-2 flex justify-between items-start">
          <div class="flex-1 pr-2">
            <div class="font-bold text-gray-900">${item.qty}x ${item.name}</div>
            ${item.options.length > 0 ? `<div class="text-[10px] text-gray-500">• ${item.options.join(', ')}</div>` : ''}
            <div class="text-red-600 font-semibold mt-0.5">$ ${(item.unitPrice * item.qty).toLocaleString('es-CL')} CLP</div>
          </div>
          <button onclick="removeFromCart(${index})" class="text-red-500 text-xs px-2 py-1 font-bold">Quitar</button>
        </div>
      `).join('');
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
      if (cart.length === 0) closeCheckoutModal();
      else openCheckoutModal();
    }

    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function getChileDateTime() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return { date: `${dd}/${mm}/${yyyy}`, time: `${hh}:${min}` };
    }

    function sendOrderToWhatsApp() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const method = document.getElementById('pay-method').value;
      const cashGiven = parseFloat(document.getElementById('cust-cash').value) || 0;
      const notes = document.getElementById('cust-notes').value.trim();

      if (!name || !phone) {
        alert("Por favor completa tu nombre y teléfono.");
        return;
      }
      if (orderType === 'delivery' && !address) {
        alert("Por favor ingresa tu dirección para el delivery.");
        return;
      }

      const orderCode = 'CL-' + Math.floor(1000000000 + Math.random() * 9000000000);
      const dt = getChileDateTime();

      let subtotal = 0;
      let productsList = [];
      cart.forEach(item => {
        const itemTotal = item.unitPrice * item.qty;
        subtotal += itemTotal;
        let line = `X${item.qty} ${item.name} $ ${itemTotal.toLocaleString('es-CL')}`;
        if (item.options.length > 0) line += `\n   • ${item.options.join(', ')}`;
        productsList.push(line);
      });

      const deliveryFee = (orderType === 'delivery') ? 2000 : 0;
      const total = subtotal + deliveryFee;

      let payDetail = "";
      if (method === 'efectivo') {
        if (cashGiven > total) {
          const vuelto = cashGiven - total;
          payDetail = `Efectivo ${total.toLocaleString('es-CL')} (monto recibido ${cashGiven.toLocaleString('es-CL')}, vuelto ${vuelto.toLocaleString('es-CL')})`;
        } else {
          payDetail = `Efectivo exacto $ ${total.toLocaleString('es-CL')}`;
        }
      } else if (method === 'tarjeta') {
        payDetail = `Tarjeta Débito/Crédito al recibir (POS)`;
      } else {
        payDetail = `Transferencia Bancaria`;
      }

      const serviceType = orderType === 'pickup' ? 'Para llevar' : 'Delivery';
      const addressLine = orderType === 'delivery' ? `\nDirección: ${address}` : '';

      const message = `${orderCode}
📅 ${dt.date} ⏰ ${dt.time}

Tipo de servicio: ${serviceType}

Nombre: ${name}
Teléfono: ${phone}${addressLine}

📝 Productos
${productsList.join('\n')}

Subtotal: $ ${subtotal.toLocaleString('es-CL')}
Entrega: $ ${deliveryFee.toLocaleString('es-CL')}
Total: $ ${total.toLocaleString('es-CL')}

💲 Pago
Estado del pago: No pagado
Total a pagar: $ ${total.toLocaleString('es-CL')}
${payDetail}

Comentarios adicionales:
${notes ? notes : 'Sin comentarios'}`;

      window.location.href = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    }

    loadLiveMenu();
  </script>
</body>
</html>
