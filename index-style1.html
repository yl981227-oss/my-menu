<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGÓN DE ORO — Menú Moderno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 pb-28">
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3 shadow-sm">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-white font-black text-xl shadow-md">🐉</div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight">DRAGÓN DE ORO</h1>
                    <p class="text-xs text-slate-500">Estilo 1: Tarjetas Modernas (Grid)</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4">
        <div id="menuGrid" class="grid grid-cols-2 gap-3.5"></div>
    </main>

    <script>
        const sampleDishes = [
            { id: 1, name: "Colación Pollo Mongoliciano", category: "Platos", price: 7300, description: "Con Arroz Chaufán y 2 arrollados primavera" },
            { id: 2, name: "Arrollado Primavera (5 u.)", category: "Entradas", price: 4200, description: "Crujientes y recién hechos" },
            { id: 3, name: "Wantán Frito (10 u.)", category: "Entradas", price: 5500, description: "Acompañado de salsa agridulce" },
            { id: 4, name: "Carne Wantán", category: "Platos", price: 8900, description: "Trocitos de carne con verduras salteadas" }
        ];

        document.getElementById('menuGrid').innerHTML = sampleDishes.map(d => `
            <div class="bg-white rounded-2xl p-3 border border-slate-100 shadow-xs flex flex-col justify-between">
                <div>
                    <div class="w-full h-32 rounded-xl bg-amber-50 mb-2 flex items-center justify-center text-3xl">🍲</div>
                    <h3 class="font-bold text-xs text-slate-800">${d.name}</h3>
                    <p class="text-[11px] text-slate-400 mt-0.5">${d.description}</p>
                </div>
                <div class="mt-3 flex items-center justify-between">
                    <span class="font-black text-xs text-amber-600">$${d.price.toLocaleString('es-CL')}</span>
                    <button class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center"><i class="fa-solid fa-plus text-xs"></i></button>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
