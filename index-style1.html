
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGÓN DE ORO — Menú Moderno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
      body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 pb-28">

    <!-- 顶部吸顶 Banner -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3 shadow-sm">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center text-white font-black text-xl shadow-md shadow-amber-500/20">🐉</div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight">DRAGÓN DE ORO</h1>
                    <p class="text-xs text-slate-500">Comida China Tradicional & Sushi</p>
                </div>
            </div>
            <div class="text-right">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse mr-1.5"></span> Abierto
                </span>
            </div>
        </div>
    </header>

    <!-- 分类吸顶导航 -->
    <nav class="sticky top-[61px] z-30 bg-white border-b border-slate-100 overflow-x-auto no-scrollbar shadow-xs">
        <div class="max-w-xl mx-auto px-4 py-2.5 flex space-x-2" id="categoryTabs">
            <button onclick="filterCategory('todos')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-bold bg-slate-900 text-white transition-all shrink-0">Todos</button>
        </div>
    </nav>

    <!-- 菜品列表：双列大图卡片 -->
    <main class="max-w-xl mx-auto p-4">
        <div id="menuGrid" class="grid grid-cols-2 gap-3.5">
            <!-- 动态加载 -->
        </div>
    </main>

    <!-- 底部悬浮购物车大胶囊 -->
    <div id="cartBar" class="fixed bottom-4 left-4 right-4 z-40 max-w-xl mx-auto transition-all transform translate-y-24">
        <div class="bg-slate-900 text-white rounded-2xl p-4 shadow-2xl flex items-center justify-between border border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="relative bg-amber-500 w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold shadow-lg shadow-amber-500/30">
                    <i class="fa-solid fa-basket-shopping text-white"></i>
                    <span id="cartCountBadge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
                </div>
                <div>
                    <p class="text-xs text-slate-400">Total a pagar</p>
                    <p id="cartTotalPrice" class="text-lg font-black text-white">$0 CLP</p>
                </div>
            </div>
            <button onclick="openCheckoutModal()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-lg shadow-amber-500/20 active:scale-95">
                Ver Pedido <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <!-- 结算模态框 -->
    <div id="checkoutModal" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom duration-200">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <h2 class="font-bold text-lg">Tu Pedido</h2>
                <button onclick="closeCheckoutModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-4">
                <div id="cartItemList" class="divide-y divide-slate-100"></div>
                <!-- 顾客表单信息 -->
                <div class="space-y-3 pt-4 border-t border-slate-100">
                    <h3 class="font-bold text-sm text-slate-700">Datos de Entrega</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="setServiceType('Para llevar')" id="btnRetiro" class="py-2.5 rounded-xl text-xs font-bold border-2 border-amber-500 bg-amber-50 text-amber-700">Retiro en local</button>
                        <button type="button" onclick="setServiceType('Despacho')" id="btnDespacho" class="py-2.5 rounded-xl text-xs font-bold border-2 border-slate-200 text-slate-600">Despacho a domicilio</button>
                    </div>
                    <input type="text" id="custName" placeholder="Nombre completo" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                    <input type="tel" id="custPhone" placeholder="Teléfono / WhatsApp (+569...)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500">
                    <input type="text" id="custAddress" placeholder="Dirección de entrega (si es despacho)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500 hidden">
                    <textarea id="custNotes" placeholder="Observaciones o alergias (opcional)" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-amber-500"></textarea>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <button onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center space-x-2">
                    <span>Confirmar y Enviar Pedido</span>
                    <i class="fa-solid fa-check"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 脚本逻辑（共用你当前的 Supabase 后端） -->
    <script>
        // 初始化 Supabase（使用项目原有凭证）
        const SUPABASE_URL = 'https://ecjxlhhhywxsqtwbujxr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjanhsaGhoeXd4c3F0d2J1anhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2OTE0NDgsImV4cCI6MjEwNzI2NzQ0OH0.7_OdMxyrL-rAZH8Kh3Uz8M_pgA_EfwiAzPqnfXUTiLs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let menuData = [];
        let cart = [];
        let currentServiceType = 'Para llevar';

        async function loadMenu() {
            const { data, error } = await supabaseClient.from('dishes').select('*').eq('available', true);
            if (error) { console.error(error); return; }
            menuData = data || [];
            renderCategories();
            renderMenu('todos');
        }

        function renderCategories() {
            const cats = ['todos', ...new Set(menuData.map(d => d.category))];
            const container = document.getElementById('categoryTabs');
            container.innerHTML = cats.map(c => `
                <button onclick="filterCategory('${c}')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold ${c === 'todos' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'} transition-all shrink-0 uppercase tracking-wider">
                    ${c}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.textContent.trim().toLowerCase() === cat.toLowerCase() || (cat === 'todos' && btn.textContent.trim() === 'Todos')) {
                    btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-white transition-all shrink-0 uppercase tracking-wider";
                } else {
                    btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600 transition-all shrink-0 uppercase tracking-wider";
                }
            });
            renderMenu(cat);
        }

        function renderMenu(cat) {
            const grid = document.getElementById('menuGrid');
            const items = cat === 'todos' ? menuData : menuData.filter(d => d.category === cat);
            grid.innerHTML = items.map(d => `
                <div class="bg-white rounded-2xl p-3 border border-slate-100 shadow-xs flex flex-col justify-between">
                    <div>
                        <div class="relative w-full h-32 rounded-xl bg-slate-100 mb-2 overflow-hidden">
                            <img src="${d.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" alt="${d.name}" class="w-full h-full object-cover">
                        </div>
                        <h3 class="font-bold text-xs text-slate-800 line-clamp-1">${d.name}</h3>
                        <p class="text-[11px] text-slate-400 line-clamp-2 mt-0.5">${d.description || ''}</p>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="font-black text-xs text-amber-600">$${d.price.toLocaleString('es-CL')}</span>
                        <button onclick='addToCart(${JSON.stringify(d).replace(/'/g, "&apos;")})' class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center hover:bg-amber-500 transition-all">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(item) {
            const existing = cart.find(i => i.id === item.id);
            if (existing) { existing.qty++; } else { cart.push({ ...item, qty: 1 }); }
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            
            document.getElementById('cartCountBadge').textContent = totalQty;
            document.getElementById('cartTotalPrice').textContent = `$${totalPrice.toLocaleString('es-CL')} CLP`;
            
            const bar = document.getElementById('cartBar');
            if (totalQty > 0) { bar.classList.remove('translate-y-24'); } else { bar.classList.add('translate-y-24'); }
        }

        function openCheckoutModal() {
            const list = document.getElementById('cartItemList');
            list.innerHTML = cart.map(i => `
                <div class="py-3 flex items-center justify-between">
                    <div>
                        <p class="font-bold text-sm">${i.name}</p>
                        <p class="text-xs text-slate-500">$${i.price.toLocaleString('es-CL')} c/u</p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <button onclick="changeQty(${i.id}, -1)" class="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center font-bold text-slate-600">-</button>
                        <span class="font-bold text-sm">${i.qty}</span>
                        <button onclick="changeQty(${i.id}, 1)" class="w-7 h-7 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold">+</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckoutModal() { document.getElementById('checkoutModal').classList.add('hidden'); }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) { cart = cart.filter(i => i.id !== id); }
            updateCartUI();
            openCheckoutModal();
            if (cart.length === 0) closeCheckoutModal();
        }

        function setServiceType(type) {
            currentServiceType = type;
            const btnR = document.getElementById('btnRetiro');
            const btnD = document.getElementById('btnDespacho');
            const addrInput = document.getElementById('custAddress');
            if (type === 'Para llevar') {
                btnR.className = "py-2.5 rounded-xl text-xs font-bold border-2 border-amber-500 bg-amber-50 text-amber-700";
                btnD.className = "py-2.5 rounded-xl text-xs font-bold border-2 border-slate-200 text-slate-600";
                addrInput.classList.add('hidden');
            } else {
                btnD.className = "py-2.5 rounded-xl text-xs font-bold border-2 border-amber-500 bg-amber-50 text-amber-700";
                btnR.className = "py-2.5 rounded-xl text-xs font-bold border-2 border-slate-200 text-slate-600";
                addrInput.classList.remove('hidden');
            }
        }

        async function submitOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const notes = document.getElementById('custNotes').value.trim();

            if (!name || !phone) { alert('Por favor ingresa tu nombre y teléfono.'); return; }
            if (currentServiceType === 'Despacho' && !address) { alert('Por favor ingresa la dirección de despacho.'); return; }

            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const orderCode = 'DRAGON-' + Math.floor(100000 + Math.random() * 900000);

            const orderPayload = {
                order_code: orderCode,
                service_type: currentServiceType,
                timing_info: 'Inmediato',
                customer_name: name,
                customer_phone: phone,
                customer_address: currentServiceType === 'Despacho' ? address : null,
                items: cart,
                subtotal: total,
                delivery_fee: 0,
                total: total,
                payment_detail: 'Efectivo / Transferencia',
                notes: notes,
                status: 'pending'
            };

            const { error } = await supabaseClient.from('orders').insert([orderPayload]);
            if (error) { alert('Error al enviar el pedido: ' + error.message); return; }

            alert('¡Pedido enviado con éxito! Código: ' + orderCode);
            cart = [];
            updateCartUI();
            closeCheckoutModal();
        }

        loadMenu();
    </script>
</body>
</html>
